<!DOCTYPE html>
<html lang="en" data-theme="dark-slate" data-layout="horizontal" data-grid="off" data-glow="off" data-links="new" data-icons="on" data-anim="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./icons/aerodash.svg">
<title>Aerodash</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button { font-family: inherit; }
  .no-transition *, .no-transition *::before, .no-transition *::after { transition: none !important; }

  html { font-size: 20px; }

  /* ── THEMES ── */
  :root, [data-theme="dark-slate"]    { --bg:#0d1117; --surface:rgba(255,255,255,0.06); --surface-hover:rgba(255,255,255,0.11); --border:rgba(255,255,255,0.15); --border-focus:rgba(148,163,184,0.7);  --text:#e2e8f0; --muted:#64748b; --accent:#94a3b8; --accent2:#cbd5e1; --grid-color:rgba(99,102,241,0.04);  --glow-color:rgba(99,102,241,0.10);  }
  [data-theme="dark-blue"]            { --bg:#060c1e; --surface:rgba(255,255,255,0.07); --surface-hover:rgba(255,255,255,0.12); --border:rgba(120,150,255,0.22); --border-focus:rgba(99,102,241,0.6);   --text:#c8d8f0; --muted:#5a6f8a; --accent:#2563eb; --accent2:#1d4ed8; --grid-color:rgba(100,130,220,0.05); --glow-color:rgba(100,130,220,0.12); }
  [data-theme="dark-orange"]          { --bg:#180d05; --surface:rgba(255,255,255,0.07); --surface-hover:rgba(255,255,255,0.12); --border:rgba(249,115,22,0.25);  --border-focus:rgba(249,115,22,0.6);   --text:#eeddd0; --muted:#8a6040; --accent:#f97316; --accent2:#fb923c; --grid-color:rgba(249,115,22,0.05);  --glow-color:rgba(249,115,22,0.12);  }
  [data-theme="dark-teal"]            { --bg:#051210; --surface:rgba(255,255,255,0.07); --surface-hover:rgba(255,255,255,0.12); --border:rgba(20,184,166,0.25);  --border-focus:rgba(20,184,166,0.6);   --text:#c8ede8; --muted:#4a8a80; --accent:#14b8a6; --accent2:#2dd4bf; --grid-color:rgba(20,184,166,0.05);  --glow-color:rgba(20,184,166,0.12);  }
  [data-theme="dark-rose"]            { --bg:#18050e; --surface:rgba(255,255,255,0.07); --surface-hover:rgba(255,255,255,0.12); --border:rgba(244,63,94,0.25);   --border-focus:rgba(244,63,94,0.6);    --text:#eed0d8; --muted:#8a5060; --accent:#f43f5e; --accent2:#fb7185; --grid-color:rgba(244,63,94,0.05);   --glow-color:rgba(244,63,94,0.12);   }
  [data-theme="dark-purple"]          { --bg:#0e0818; --surface:rgba(255,255,255,0.07); --surface-hover:rgba(255,255,255,0.12); --border:rgba(168,85,247,0.25);  --border-focus:rgba(168,85,247,0.6);   --text:#e8d8f8; --muted:#7850a0; --accent:#a855f7; --accent2:#c084fc; --grid-color:rgba(168,85,247,0.05);  --glow-color:rgba(168,85,247,0.12);  }
  [data-theme="light-slate"]          { --bg:#f1f5f9; --surface:rgba(0,0,0,0.05);       --surface-hover:rgba(0,0,0,0.09);       --border:rgba(0,0,0,0.18);       --border-focus:rgba(99,102,241,0.5);   --text:#1e293b; --muted:#64748b; --accent:#94a3b8; --accent2:#cbd5e1; --grid-color:rgba(99,102,241,0.05);  --glow-color:rgba(99,102,241,0.06);  }
  [data-theme="light-blue"]           { --bg:#ddeeff; --surface:rgba(0,0,0,0.06);       --surface-hover:rgba(0,0,0,0.10);       --border:rgba(0,0,0,0.16);       --border-focus:rgba(37,99,235,0.5);    --text:#0a1e38; --muted:#3a6090; --accent:#2563eb; --accent2:#1d4ed8; --grid-color:rgba(37,99,235,0.06);   --glow-color:rgba(37,99,235,0.08);   }
  [data-theme="light-orange"]         { --bg:#fff4e6; --surface:rgba(0,0,0,0.05);       --surface-hover:rgba(0,0,0,0.09);       --border:rgba(0,0,0,0.16);       --border-focus:rgba(249,115,22,0.5);   --text:#2a1200; --muted:#9a6030; --accent:#f97316; --accent2:#fb923c; --grid-color:rgba(249,115,22,0.05);  --glow-color:rgba(249,115,22,0.07);  }
  [data-theme="light-teal"]           { --bg:#daf5f0; --surface:rgba(0,0,0,0.06);       --surface-hover:rgba(0,0,0,0.10);       --border:rgba(0,0,0,0.16);       --border-focus:rgba(20,184,166,0.5);   --text:#082820; --muted:#2a7a70; --accent:#14b8a6; --accent2:#2dd4bf; --grid-color:rgba(20,184,166,0.06);  --glow-color:rgba(20,184,166,0.08);  }
  [data-theme="light-rose"]           { --bg:#fff0f4; --surface:rgba(0,0,0,0.05);       --surface-hover:rgba(0,0,0,0.09);       --border:rgba(0,0,0,0.16);       --border-focus:rgba(244,63,94,0.5);    --text:#2a0a18; --muted:#a05070; --accent:#f43f5e; --accent2:#fb7185; --grid-color:rgba(244,63,94,0.05);   --glow-color:rgba(244,63,94,0.07);   }
  [data-theme="light-purple"]         { --bg:#ede0ff; --surface:rgba(0,0,0,0.06);       --surface-hover:rgba(0,0,0,0.10);       --border:rgba(0,0,0,0.16);       --border-focus:rgba(168,85,247,0.5);   --text:#1e0a38; --muted:#7050a0; --accent:#a855f7; --accent2:#c084fc; --grid-color:rgba(168,85,247,0.06);  --glow-color:rgba(168,85,247,0.08);  }

  /* ── BASE ── */
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300; background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
    transition: background 0.25s, color 0.25s;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 2.5rem 2.5rem; transition: opacity 0.25s;
  }
  [data-grid="off"] body::before { opacity: 0; }

  /* ── GLOW ── */
  .glow {
    position: fixed; top: -12rem; left: 50%; transform: translateX(-50%);
    width: 37.5rem; height: 37.5rem; border-radius: 50%;
    background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
    pointer-events: none; z-index: 0; transition: opacity 0.25s;
  }
  [data-glow="off"]  .glow { opacity: 0; }
  [data-glow="low"]  .glow { opacity: 0.6; transform: translateX(-50%) scale(1.5); }
  [data-glow="high"] .glow { opacity: 1;   transform: translateX(-50%) scale(2.5); }

  /* ── LAYOUT ── */
  .wrapper  { position: relative; z-index: 1; padding: 2rem 1.5rem 3rem; }
  .content  { margin: 0 auto; }

  /* ── BOTTOMBAR ── */
  .bottombar {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    padding: 0.7rem 1.5rem; border-top: 1px solid var(--border);
    margin-top: 2rem; transition: border-color 0.25s;
  }

  /* ── TABBAR ── */
  .tabbar {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    padding: 0.7rem 0; border-bottom: 1px solid var(--border);
    margin-bottom: 1.4rem; transition: border-color 0.25s;
  }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em;
    color: var(--muted); padding: 0.2rem 0.4rem; border-radius: 0.25rem;
    transition: color 0.15s;
  }
  .tab-btn:hover  { color: var(--accent2); }
  .tab-btn.active { color: var(--text); }
  /* ── OPTIONS BUTTON ── */
  .options-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); line-height: 1;
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em;
    padding: 0.2rem 0.4rem; border-radius: 0.25rem; transition: color 0.15s;
  }
  .options-btn:hover { color: var(--accent2); }

  /* ── OPTIONS FLYOUT ── */
  .options-wrap   { position: relative; display: flex; flex-direction: column; align-items: center; }
  .options-flyout {
    position: absolute; bottom: calc(100% + 0.6rem); left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 0.6rem; padding: 0.6rem 0.8rem;
    display: flex; flex-direction: column; gap: 0.45rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; z-index: 200; min-width: 16rem;
    transition: opacity 0.15s, transform 0.15s;
  }
  .options-flyout.open    { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .options-flyout.flipped { bottom: auto; top: calc(100% + 0.6rem); transform: translateX(-50%) translateY(-4px); }
  .options-flyout.flipped.open { transform: translateX(-50%) translateY(0); }

  /* ── OPTIONS ROWS ── */
  .opt-row   { display: flex; align-items: center; gap: 0.4rem; }
  .opt-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); width: 4.5rem; flex-shrink: 0; }
  .opt-section {
    display: flex; flex-direction: column; gap: 0.35rem;
    padding-top: 0.45rem; border-top: 1px solid var(--border);
  }
  .opt-section.no-border  { border-top: none; padding-top: 0; }
  .opt-section .opt-row   { padding-left: 0.4rem; min-height: 1.4rem; }
  .opt-section-title      { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); opacity: 0.6; }
  .opt-val-label          { font-size: 0.62rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; width: 2.2rem; flex-shrink: 0; text-align: right; }

  /* ── SWATCHES ── */
  .swatch-row  { display: flex; gap: 0.35rem; }
  .swatch {
    width: 1.1rem; height: 1.1rem; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; flex-shrink: 0;
    transition: transform 0.12s, border-color 0.12s;
  }
  .swatch:hover                        { transform: scale(1.2); }
  .swatch.active                       { border-color: #fff; }
  [data-theme^="light"] .swatch.active { border-color: #000; }

  /* ── OPTION BUTTONS ── */
  .pal-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 0.3rem;
    font-size: 0.6rem; font-weight: 500; cursor: pointer;
    padding: 0.18rem 0.35rem; white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .pal-btn:hover  { background: var(--surface-hover); color: var(--text); }
  .pal-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── OPTION SLIDERS ── */
  .opt-slider { -webkit-appearance: none; appearance: none; flex: 1; height: 3px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer; }
  .opt-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--accent2); cursor: pointer; box-shadow: 0 0 5px var(--accent); }
  .opt-slider::-moz-range-thumb     { width: 11px; height: 11px; border-radius: 50%; background: var(--accent2); cursor: pointer; border: none; box-shadow: 0 0 5px var(--accent); }

  /* ── CARDS ── */
  :root { --card-w: 10rem; --card-h: 3rem; }

  .group-title {
    font-size: 0.8rem; letter-spacing: 0.1em;
    color: var(--muted); font-weight: 500; margin-bottom: 0.5rem; padding-left: 0.15rem;
  }
  .card-item {
    display: flex; align-items: center; gap: 0.6rem;
    width: var(--card-w); height: var(--card-h); padding: 0.6rem 0.75rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0.5rem; text-decoration: none; color: var(--text);
    white-space: nowrap; overflow: hidden;
    transition: background 0.15s, border-color 0.15s;
  }
  .card-item:hover { background: var(--surface-hover); border-color: var(--border-focus); }
  .card-icon     { width: min(calc(var(--card-h) * 0.65), 1.75rem); height: min(calc(var(--card-h) * 0.65), 1.75rem); border-radius: 0.35rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
  .card-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 0.2rem; }
  .card-name     { font-size: 0.8rem; font-weight: 400; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card-divider  { width: 100%; height: 1px; background: var(--border); margin: 0.4rem 0; }

  [data-icons="off"] .card-icon { display: none; width: 0; margin: 0; }

  /* ── VERTICAL LAYOUT ── */
  .card-groups { display: flex; flex-wrap: wrap; gap: 1rem; padding-top: 1.2rem; margin-bottom: 1.6rem; }
  .card-list   { display: flex; flex-direction: column; gap: 0.3rem; }

  /* ── HORIZONTAL LAYOUT ── */
  [data-layout="horizontal"] .card-groups  { flex-direction: column; gap: 1.2rem; }
  [data-layout="horizontal"] .card-group   { width: 100% !important; }
  [data-layout="horizontal"] .card-list    { flex-direction: row; flex-wrap: wrap; gap: 0.3rem; }
  [data-layout="horizontal"] .group-title  { margin-bottom: 0.5rem; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .bottombar  { animation: fadeUp .35s both; opacity: 0; transform: translateY(6px); }
  .card-group { animation: fadeUp .35s both;        opacity: 0; transform: translateY(6px); }
  [data-anim="off"] .card-group,
  [data-anim="off"] .bottombar { animation: none; opacity: 1; transform: none; }

  /* ── CONFIG ERROR ── */
  .config-error {
    display: none;
    margin: 0 auto 1rem; padding: 0.6rem 0.9rem; width: fit-content;
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4);
    border-radius: 0.5rem; color: #f87171; font-size: 0.72rem; font-weight: 500;
  }
  .config-error a { color: #f87171; text-decoration: underline; }

  .version-str { font-size: 0.52rem; color: var(--muted); text-align: center; margin-top: 0.15rem; letter-spacing: 0.04em; }
</style>

<script>
  // Apply saved settings before first paint to prevent flash
  (function() {
    const h = document.documentElement;
    ['theme','layout','grid','glow','links','icons','anim'].forEach(k => {
      const v = localStorage.getItem('hp-' + k);
      if (v) h.setAttribute('data-' + k, v);
    });
    h.classList.add('no-transition');
    requestAnimationFrame(() => requestAnimationFrame(() => h.classList.remove('no-transition')));
  })();
</script>
<script src="./config.js"></script>
</head>

<body>
<div class="glow"></div>
<div class="wrapper">

  <div id="configError" class="config-error"></div>

  <div class="content" id="content">
    <div class="tabbar" id="tabBar" style="display:none"></div>
    <div class="card-groups" id="cardGroups"></div>

    <header class="bottombar">
      <div class="options-wrap">
        <button class="options-btn" id="optionsBtn">OPTIONS</button>
        <div class="version-str" id="versionStr"></div>
        <div class="options-flyout" id="optionsFlyout"></div>
      </div>
    </header>
  </div><!-- /content -->

</div><!-- /wrapper -->

<script>

  // ── HELPERS ──
  const VERSION = '2026.03.18a';
  const ROOT    = document.documentElement;
  function el(tag, props) { return Object.assign(document.createElement(tag), props); }

  // ── DOM REFS ──
  const cardGroupsEl  = document.getElementById('cardGroups');
  const contentEl     = document.getElementById('content');
  const tabBarEl      = document.getElementById('tabBar');
  const optionsBtnEl  = document.getElementById('optionsBtn');
  const optionsFlyEl  = document.getElementById('optionsFlyout');
  const configErrorEl = document.getElementById('configError');
  const versionStrEl  = document.getElementById('versionStr');

  // ── CONFIG ──
  let TABS;
  try {
    if (typeof CONFIG === 'undefined') throw new Error('config.js failed to load. Ensure the file exists and is free of syntax errors.');
    TABS = CONFIG.tabs;
    if (!TABS?.length) throw new Error('CONFIG.tabs is missing or empty.');
  } catch (e) {
    console.warn('Aerodash:', e.message);
    TABS = [{ name: 'Home', cards: [] }];
    configErrorEl.innerHTML = '⚠ Aerodash couldn\'t load your configuration. Please ensure config.js exists and is free of syntax errors. If issues persist, check the <a href="https://github.com/Aerowinder/aerodash/blob/main/README.md" target="_blank" rel="noopener noreferrer">readme</a> or <a href="https://github.com/Aerowinder/aerodash/issues" target="_blank" rel="noopener noreferrer">open an issue on GitHub</a>.';
    configErrorEl.style.display = 'block';
  }

  // ── TABS ──
  let activeTab = Math.max(0, Math.min(parseInt(localStorage.getItem('hp-tab'), 10) || 0, TABS.length - 1));

  function renderCards(cards, container) {
    if (!cards?.length) return;
    const frag = document.createDocumentFragment();
    cards.forEach(entry => {
      if (entry.divider) {
        frag.appendChild(el('div', { className: 'card-divider' }));
        return;
      }
      const g    = el('div', { className: 'card-group' });
      const list = el('div', { className: 'card-list' });
      g.appendChild(el('div', { className: 'group-title', textContent: entry.group }));
      (entry.items || []).forEach(({ name, url, icon }) => {
        const a       = el('a',   { href: url, className: 'card-item' });
        const iconDiv = el('div', { className: 'card-icon' });
        if (icon) {
          const img = Object.assign(document.createElement('img'), { src: icon, alt: '', loading: 'lazy' });
          img.onerror = () => iconDiv.remove();
          iconDiv.appendChild(img);
          a.appendChild(iconDiv);
        }
        a.appendChild(el('span', { className: 'card-name', textContent: name }));
        list.appendChild(a);
      });
      g.appendChild(list);
      frag.appendChild(g);
    });
    container.appendChild(frag);
  }

  function buildTabs() {
    if (TABS.length <= 1) { tabBarEl.style.display = 'none'; return; }
    tabBarEl.style.display = 'flex';
    tabBarEl.innerHTML = '';
    TABS.forEach((tab, i) => {
      const b = el('button', { className: 'tab-btn' + (i === activeTab ? ' active' : ''), textContent: tab.name });
      b.onclick = () => switchTab(i);
      tabBarEl.appendChild(b);
    });
  }

  function switchTab(index) {
    activeTab = index;
    localStorage.setItem('hp-tab', index);
    buildTabs();
    renderTab(index);
  }

  function renderTab(index) {
    cardGroupsEl.innerHTML = '';
    renderCards((TABS[index] || TABS[0]).cards, cardGroupsEl);
    document.querySelectorAll('.card-group').forEach((g, i) => { g.style.animationDelay = (0.04 + i * 0.04) + 's'; });
    applyLinks();
    applyLayout();
  }

  // ── LAYOUT ──
  let CARD_W         = parseFloat(localStorage.getItem('hp-card-w') || '10');
  const GAP_H        = 0.3;   // horizontal: gap between cards in a row
  const GAP_V        = 1.0;   // vertical:   gap between group columns
  const fmt          = v => parseFloat(v).toFixed(1);

  function getRootFontSize() { return parseFloat(getComputedStyle(ROOT).fontSize); }

  function applyCardWidth(w) {
    CARD_W = w;
    ROOT.style.setProperty('--card-w', w + 'rem');
    localStorage.setItem('hp-card-w', w);
  }

  function applyCardHeight(h) {
    ROOT.style.setProperty('--card-h', h + 'rem');
    localStorage.setItem('hp-card-h', h);
  }

  function applyLayout() {
    const colTarget = parseInt(localStorage.getItem('hp-cols') || '10', 10);
    const isH       = ROOT.getAttribute('data-layout') === 'horizontal';
    const gap       = isH ? GAP_H : GAP_V;
    const rootFont  = getRootFontSize();
    const rem2px    = r => r * rootFont;
    const avail     = window.innerWidth - rem2px(3);
    const fits      = Math.max(1, Math.floor((avail + rem2px(gap)) / (rem2px(CARD_W) + rem2px(gap))));

    let itemCap;
    if (isH) {
      // Horizontal: cap by the longest group (most items in a single row)
      const lists = cardGroupsEl.querySelectorAll('.card-list');
      itemCap = lists.length ? Math.max(...Array.from(lists, l => l.children.length)) : Infinity;
    } else {
      // Vertical: cap by the largest run of groups between dividers
      // e.g. 4 groups, divider, 4 groups → cap is 4, not 8
      let max = 0, run = 0;
      for (const c of cardGroupsEl.children) {
        if (c.classList.contains('card-divider')) { max = Math.max(max, run); run = 0; }
        else if (c.classList.contains('card-group')) { run++; }
      }
      itemCap = Math.max(max, run) || colTarget;
    }

    const cols = Math.min(colTarget, fits, itemCap);
    contentEl.style.width = (cols * rem2px(CARD_W) + (cols - 1) * rem2px(gap)) + 'px';
  }

  let resizePending = false;
  window.addEventListener('resize', () => {
    if (!resizePending) {
      resizePending = true;
      requestAnimationFrame(() => { applyLayout(); resizePending = false; });
    }
  });

  function applyLinks() {
    const isNew = (ROOT.getAttribute('data-links') || 'new') === 'new';
    cardGroupsEl.querySelectorAll('.card-item').forEach(a => {
      a.target = isNew ? '_blank' : '_self';
      a.rel    = isNew ? 'noopener noreferrer' : '';
    });
  }

  // ── THEMES ──
  const THEMES = {
    dark: [
      { id: 'dark-slate',   color: '#94a3b8', label: 'Dark Slate' },
      { id: 'dark-blue',    color: '#2563eb', label: 'Dark Blue'  },
      { id: 'dark-orange',  color: '#f97316', label: 'Dark Orange'  },
      { id: 'dark-teal',    color: '#14b8a6', label: 'Dark Teal'    },
      { id: 'dark-rose',    color: '#f43f5e', label: 'Dark Rose'    },
      { id: 'dark-purple',  color: '#a855f7', label: 'Dark Purple'  },
    ],
    light: [
      { id: 'light-slate',  color: '#94a3b8', label: 'Light Slate' },
      { id: 'light-blue',   color: '#2563eb', label: 'Light Blue'    },
      { id: 'light-orange', color: '#f97316', label: 'Light Orange' },
      { id: 'light-teal',   color: '#14b8a6', label: 'Light Teal'   },
      { id: 'light-rose',   color: '#f43f5e', label: 'Light Rose'   },
      { id: 'light-purple', color: '#a855f7', label: 'Light Purple' },
    ]
  };

  function applyTheme(id) {
    ROOT.setAttribute('data-theme', id);
    localStorage.setItem('hp-theme', id);
  }

  // ── OPTIONS PANEL ──
  function optRow(label, values, active, attr, key, extra) {
    const row = el('div', { className: 'opt-row' });
    row.appendChild(el('span', { className: 'opt-label', textContent: label }));
    values.forEach(([display, value]) => {
      const b = el('button', { className: 'pal-btn' + (active === value ? ' active' : ''), textContent: display });
      b.onclick = () => {
        ROOT.setAttribute(attr, value);
        localStorage.setItem(key, value);
        if (extra) extra();
        buildOptions();
      };
      row.appendChild(b);
    });
    return row;
  }

  function sliderRow(label, opts, onInput, onChange, fmtLabel) {
    const row    = el('div',   { className: 'opt-row' });
    const slider = el('input', { type: 'range', ...opts, className: 'opt-slider' });
    const fmtFn  = fmtLabel || fmt;
    const lbl    = el('span',  { className: 'opt-val-label', textContent: fmtFn(opts.value) });
    slider.oninput  = () => { lbl.textContent = fmtFn(slider.value); if (onInput) onInput(slider.value); };
    slider.onchange = () => { lbl.textContent = fmtFn(slider.value); onChange(slider.value); };
    row.appendChild(el('span', { className: 'opt-label', textContent: label }));
    row.appendChild(slider);
    row.appendChild(lbl);
    return row;
  }

  function section(title, noBorder) {
    const s = el('div', { className: 'opt-section' + (noBorder ? ' no-border' : '') });
    s.appendChild(el('span', { className: 'opt-section-title', textContent: title }));
    return s;
  }

  function buildOptions() {
    const theme = ROOT.getAttribute('data-theme') || 'dark-slate';
    const cols  = parseInt(localStorage.getItem('hp-cols') || '10', 10);
    const cardH = parseFloat(localStorage.getItem('hp-card-h') || '3');
    optionsFlyEl.innerHTML = '';

    // THEME
    const themeSection = section('THEME', true);
    ['dark', 'light'].forEach(group => {
      const row = el('div', { className: 'opt-row' });
      row.appendChild(el('span', { className: 'opt-label', textContent: group }));
      const swatchRow = el('div', { className: 'swatch-row' });
      THEMES[group].forEach(t => {
        const s = el('button', { className: 'swatch' + (t.id === theme ? ' active' : ''), title: t.label });
        s.style.background = t.color;
        s.onclick = () => { applyTheme(t.id); buildOptions(); };
        swatchRow.appendChild(s);
      });
      row.appendChild(swatchRow);
      themeSection.appendChild(row);
    });
    optionsFlyEl.appendChild(themeSection);

    // DISPLAY
    const display = section('DISPLAY');
    display.appendChild(optRow('icons', [['off','off'],['on','on']],                       ROOT.getAttribute('data-icons') || 'on',         'data-icons',  'hp-icons'));
    display.appendChild(optRow('anim',  [['off','off'],['on','on']],                       ROOT.getAttribute('data-anim')  || 'on',         'data-anim',   'hp-anim'));
    display.appendChild(optRow('grid',  [['off','off'],['on','on']],                       ROOT.getAttribute('data-grid')  || 'off',        'data-grid',   'hp-grid'));
    display.appendChild(optRow('glow',  [['off','off'],['low','low'],['high','high']],     ROOT.getAttribute('data-glow')  || 'off',        'data-glow',   'hp-glow'));
    optionsFlyEl.appendChild(display);

    // LAYOUT
    const layout = section('LAYOUT');
    layout.appendChild(optRow('mode',  [['horizontal','horizontal'],['vertical','vertical']], ROOT.getAttribute('data-layout') || 'horizontal', 'data-layout', 'hp-layout', applyLayout));
    layout.appendChild(optRow('links', [['new tab','new'],['same tab','same']],               ROOT.getAttribute('data-links')  || 'new',        'data-links',  'hp-links',  applyLinks));
    layout.appendChild(sliderRow('cols',   { min: 1,   max: 20,  value: cols,  step: 1   }, null, v => { localStorage.setItem('hp-cols', v); applyLayout(); }));
    // Same integer trick as height — 0.5 step sliders can snap incorrectly due to
    // floating point precision in some browsers. Multiply by 2 to use integer steps.
    layout.appendChild(sliderRow('width',  { min: 10,  max: 40,  value: Math.round(CARD_W * 2), step: 1 }, null, v => { applyCardWidth(parseInt(v, 10) / 2); applyLayout(); }, v => fmt(parseInt(v, 10) / 2)));
    // Height slider runs on integers internally (value * 2) to avoid browser float
    // snap point ambiguity with fractional min/step values (e.g. min:1.5, step:0.5
    // causes 3.0 to snap to 3.5 due to floating point rounding in some browsers).
    // The label formatter and onChange divide by 2 to restore the real rem value.
    layout.appendChild(sliderRow('height', { min: 2, max: 10, value: Math.round(cardH * 2), step: 1 }, null, v => { applyCardHeight(parseInt(v, 10) / 2); }, v => fmt(parseInt(v, 10) / 2)));
    optionsFlyEl.appendChild(layout);
  }

  function toggleOptions(e) {
    e.stopPropagation();
    if (optionsFlyEl.classList.contains('open')) {
      optionsFlyEl.classList.remove('open');
      return;
    }
    buildOptions();
    // Clear stale positioning, then measure true scrollHeight
    optionsFlyEl.classList.remove('flipped');
    optionsFlyEl.style.visibility = 'hidden';
    optionsFlyEl.classList.add('open');
    requestAnimationFrame(() => {
      const btnRect = optionsBtnEl.getBoundingClientRect();
      optionsFlyEl.classList.toggle('flipped', btnRect.top < optionsFlyEl.scrollHeight + 20);
      optionsFlyEl.style.visibility = '';
    });
  }

  optionsBtnEl.addEventListener('click', toggleOptions);

  document.addEventListener('click', e => {
    if (!e.target.closest('.options-wrap'))
      optionsFlyEl.classList.remove('open');
  });

  // ── INIT ──
  // Attributes already restored in <head>; here we run DOM-dependent functions.
  (function () {
    versionStrEl.textContent = 'Aerodash - v' + VERSION;
    applyCardWidth(parseFloat(localStorage.getItem('hp-card-w') || '10'));
    applyCardHeight(parseFloat(localStorage.getItem('hp-card-h') || '3'));
    buildTabs();
    renderTab(activeTab);
  })();

</script>
</body>
</html>
