<!DOCTYPE html>
<html lang="en" data-theme="dark-gray" data-layout="horizontal" data-grid="off" data-glow="off" data-links="new" data-icons="on" data-anim="on" data-stealth="off" data-darkreader-ignore>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="./icons/aerodash.svg">
<title>Aerodash</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button { font-family: inherit; }
  .no-transition *, .no-transition *::before, .no-transition *::after { transition: none !important; }

  html { font-size: 20px; }

  /* ── THEMES ── */
  :root, [data-theme^="dark"] {
    --card-bg:     rgba(255,255,255,0.10);
    --card-bghover:rgba(255,255,255,0.15);
    --card-text:   color-mix(in srgb, var(--base) 30%, white);
    --muted:       color-mix(in srgb, var(--base) 60%, transparent);
    --site-bg:     color-mix(in srgb, var(--base) 20%, black);
  }
  [data-theme^="light"] {
    --card-bg:     rgba(0,0,0,0.08);
    --card-bghover:rgba(0,0,0,0.13);
    --card-text:   color-mix(in srgb, var(--base) 30%, black);
    --muted:       color-mix(in srgb, var(--base) 60%, white);
    --site-bg:     color-mix(in srgb, var(--base) 20%, white);
  }

  :root,
  [data-theme="dark-gray"]     { --base:#7888a0; }
  [data-theme="dark-blue"]     { --base:#3a78d8; }
  [data-theme="dark-orange"]   { --base:#c07030; }
  [data-theme="dark-green"]    { --base:#28a878; }
  [data-theme="dark-red"]      { --base:#c03048; }
  [data-theme="dark-purple"]   { --base:#8858c8; }

  [data-theme="light-gray"]    { --base:#5a6878; }
  [data-theme="light-blue"]    { --base:#1848a0; }
  [data-theme="light-orange"]  { --base:#904000; }
  [data-theme="light-green"]   { --base:#0a6040; }
  [data-theme="light-red"]     { --base:#901030; }
  [data-theme="light-purple"]  { --base:#501888; }

  /* ── BASE STYLES ── */
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300; background: var(--site-bg); color: var(--card-text);
    min-height: 100vh; overflow-x: hidden;
    transition: background 0.25s;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(color-mix(in srgb, var(--muted) 10%, transparent) 1px, transparent 1px),
                      linear-gradient(90deg, color-mix(in srgb, var(--muted) 10%, transparent) 1px, transparent 1px);
    background-size: 2.5rem 2.5rem; transition: opacity 0.25s;
  }
  [data-grid="off"] body::before { opacity: 0; }

  /* ── GLOW ── */
  .glow {
    position: fixed; top: -12rem; left: 50%; transform: translateX(-50%);
    width: 37.5rem; height: 37.5rem; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--base) 8%, transparent) 0%, transparent 70%);
    pointer-events: none; z-index: 0; transition: opacity 0.25s;
  }
  [data-glow="off"]  .glow { opacity: 0; }
  [data-glow="low"]  .glow { opacity: 0.9; transform: translateX(-50%) scale(2.0); }
  [data-glow="med"]  .glow { opacity: 1;   transform: translateX(-50%) scale(2.5); background: radial-gradient(circle, color-mix(in srgb, var(--base) 12%, transparent) 0%, transparent 70%); }
  [data-glow="high"] .glow { opacity: 1;   transform: translateX(-50%) scale(2.5); background: radial-gradient(circle, color-mix(in srgb, var(--base) 18%, transparent) 0%, transparent 70%); }

  /* ── LAYOUT ── */
  .wrapper  { position: relative; z-index: 1; padding: 2rem 1.5rem 3rem; }
  .content  { margin: 0 auto; }

  /* ── BOTTOMBAR ── */
  .bottombar {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    padding: 0.7rem 1.5rem;
    margin-top: 2rem;
  }

  /* ── TABBAR ── */
  .tabbar {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    padding: 0.7rem 0;
    margin-bottom: 1.4rem;
  }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em;
    color: var(--muted); opacity: 0.7; padding: 0.2rem 0.4rem; border-radius: 0.25rem;
    transition: color 0.15s, opacity 0.15s;
  }
  .tab-btn:hover  { color: #fff; opacity: 1; }
  .tab-btn.active { color: var(--base); opacity: 1; }
  [data-theme^="light"] .tab-btn:hover  { color: #000; }

  /* ── OPTIONS BUTTON ── */
  .options-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--base); line-height: 1;
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em;
    padding: 0.2rem 0.4rem; border-radius: 0.25rem; transition: color 0.15s;
  }
  .options-btn:hover { color: #fff; }
  [data-theme^="light"] .options-btn:hover { color: #000; }

  /* ── OPTIONS FLYOUT ── */
  .options-wrap   { position: relative; display: flex; flex-direction: column; align-items: center; }
  .options-flyout {
    position: absolute; bottom: calc(100% + 0.6rem); left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--site-bg); border: 1px solid var(--base);
    border-radius: 0.6rem; padding: 0.6rem 0.8rem;
    display: flex; flex-direction: column; gap: 0.45rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; z-index: 200; min-width: 16rem;
    transition: opacity 0.15s, transform 0.15s;
  }
  .options-flyout.open    { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .options-flyout.flipped { bottom: auto; top: calc(100% + 0.6rem); transform: translateX(-50%) translateY(-4px); }
  .options-flyout.flipped.open { transform: translateX(-50%) translateY(0); }

  /* ── OPTIONS ROWS ── */
  .opt-row   { display: flex; align-items: center; gap: 0.4rem; }
  .opt-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.04em; color: var(--base); width: 4.5rem; flex-shrink: 0; }
  .opt-section {
    display: flex; flex-direction: column; gap: 0.35rem;
    padding-top: 0.45rem; border-top: 1px solid var(--muted);
  }
  .opt-section.no-border  { border-top: none; padding-top: 0; }
  .opt-section .opt-row   { padding-left: 0.4rem; min-height: 1.4rem; }
  .opt-section-title      { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--base); }
  .opt-val-label          { font-size: 0.62rem; color: var(--base); font-variant-numeric: tabular-nums; font-weight: 500; width: 2.2rem; flex-shrink: 0; text-align: right; }

  /* ── SWATCHES ── */
  .swatch-row  { display: flex; gap: 0.35rem; }
  .swatch {
    width: 1.1rem; height: 1.1rem; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; flex-shrink: 0;
    transition: transform 0.12s, border-color 0.12s;
  }
  .swatch:hover                        { transform: scale(1.2); }
  .swatch.active                       { border-color: #fff; }
  [data-theme^="light"] .swatch.active { border-color: #000; }

  /* ── OPTION BUTTONS ── */
  .pal-btn {
    background: transparent; border: 1px solid var(--muted);
    color: var(--muted); border-radius: 0.3rem;
    font-size: 0.6rem; font-weight: 500; cursor: pointer;
    padding: 0.18rem 0.35rem; white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .pal-btn:hover                       { border-color: #fff; color: #fff; }
  [data-theme^="light"] .pal-btn:hover { border-color: #000; color: #000; }
  .pal-btn.active { background: var(--base); border-color: var(--base); color: #fff; }

  /* ── OPTION SLIDERS ── */
  .opt-slider { -webkit-appearance: none; appearance: none; flex: 1; height: 3px; border-radius: 2px; background: var(--base); outline: none; cursor: pointer; }
  .opt-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--base); cursor: pointer; }
  .opt-slider::-moz-range-thumb     { width: 11px; height: 11px; border-radius: 50%; background: var(--base); cursor: pointer; border: none; }

  /* ── CARDS ── */
  :root { --card-w: 10rem; --card-h: 3rem; }

  .group-title {
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em;
    color: var(--base); margin-bottom: 0.5rem; padding-left: 0.15rem;
  }
  .card-item {
    display: flex; align-items: center; gap: 0.6rem;
    width: var(--card-w); height: var(--card-h); padding: 0.6rem 0.75rem;
    background: var(--card-bg); border: 1px solid var(--muted);
    border-radius: 0.5rem; text-decoration: none; color: var(--card-text);
    white-space: nowrap; overflow: hidden;
    transition: background 0.15s, border-color 0.15s;
  }
  .card-item:hover { background: var(--card-bghover); border-color: var(--base); }
  .card-icon {
    width: min(calc(var(--card-h) * 0.65), 1.75rem); height: min(calc(var(--card-h) * 0.65), 1.75rem);
    border-radius: 0.35rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .card-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 0.2rem; }
  .card-name     { font-size: 0.8rem; font-weight: 400; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card-divider  { width: 100%; border-top: 1px solid var(--muted); margin: 0.4rem 0; }

  [data-icons="off"] .card-icon { display: none; }

  /* ── STEALTH MODE ── */
  [data-stealth="on"] .card-item       { background: transparent; border-color: transparent; }
  [data-stealth="on"] .card-item:hover { border-color: var(--base); }

  /* ── VERTICAL LAYOUT ── */
  .card-groups { display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; gap: 1rem; padding-top: 1.2rem; margin-bottom: 1.6rem; }
  .card-list   { display: flex; flex-direction: column; gap: 0.3rem; }
  .card-group  { width: var(--card-w); }

  /* ── HORIZONTAL LAYOUT ── */
  [data-layout="horizontal"] .card-groups  { flex-direction: column; gap: 1.2rem; }
  [data-layout="horizontal"] .card-group   { width: 100% !important; }
  [data-layout="horizontal"] .card-list    { flex-direction: row; flex-wrap: wrap; gap: 0.3rem; }
  [data-layout="horizontal"] .group-title  { margin-bottom: 0.5rem; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .bottombar    { animation: fadeUp .35s both; opacity: 0; transform: translateY(6px); }
  .card-group,
  .card-divider { animation: fadeUp .35s both; opacity: 0; transform: translateY(6px); }
  [data-anim="off"] .card-group,
  [data-anim="off"] .card-divider,
  [data-anim="off"] .bottombar { animation: none; opacity: 1; transform: none; }

  /* ── CONFIG ERROR ── */
  .config-error {
    display: none;
    margin: 0 auto 1rem; padding: 0.6rem 0.9rem; width: fit-content;
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4);
    border-radius: 0.5rem; color: #f87171; font-size: 0.72rem; font-weight: 500;
  }
  .config-error a { color: #f87171; text-decoration: underline; }

  /* ── FLYOUT HEADER ── */
  .flyout-header { display: flex; align-items: center; padding-bottom: 0.35rem; border-bottom: 1px solid var(--muted); }
  .flyout-header-title,
  .flyout-header-link  { font-size: 0.62rem; font-weight: 600; color: var(--base); letter-spacing: 0.04em; }
  .flyout-header-title { flex: 1; }
  .flyout-header-link  { text-decoration: none; }
  .flyout-header-link:hover { color: var(--card-text); }
</style>

<script>
  // Apply saved settings before first paint to prevent flash
  (function() {
    const h = document.documentElement;
    [
      ['ad-theme',     'data-theme'],
      ['ad-view',      'data-layout'],
      ['ad-grid',      'data-grid'],
      ['ad-glow',      'data-glow'],
      ['ad-links',     'data-links'],
      ['ad-icons',     'data-icons'],
      ['ad-animation', 'data-anim'],
      ['ad-stealth',   'data-stealth'],
    ].forEach(([key, attr]) => {
      const v = localStorage.getItem(key);
      if (v) h.setAttribute(attr, v);
    });
    h.classList.add('no-transition');
    requestAnimationFrame(() => requestAnimationFrame(() => h.classList.remove('no-transition')));
  })();
</script>
<script src="./config.js"></script>
</head>

<body>
<div class="glow"></div>
<div class="wrapper">

  <div id="configError" class="config-error"></div>

  <div class="content" id="content">
    <div class="tabbar" id="tabBar" style="display:none"></div>
    <div class="card-groups" id="cardGroups"></div>

    <div class="bottombar">
      <div class="options-wrap">
        <button class="options-btn" id="optionsBtn">OPTIONS</button>
        <div class="options-flyout" id="optionsFlyout"></div>
      </div>
    </div>
  </div>

</div>

<script>

  // ── HELPERS ──
  const VERSION = '2026.03.18d';
  const ROOT    = document.documentElement;
  function el(tag, props) { return Object.assign(document.createElement(tag), props); }

  // ── DOM REFS ──
  const cardGroupsEl  = document.getElementById('cardGroups');
  const contentEl     = document.getElementById('content');
  const tabBarEl      = document.getElementById('tabBar');
  const optionsBtnEl  = document.getElementById('optionsBtn');
  const optionsFlyEl  = document.getElementById('optionsFlyout');
  const configErrorEl = document.getElementById('configError');

  // ── CONFIG ──
  let TABS;
  try {
    if (typeof CONFIG === 'undefined') throw new Error('config.js failed to load. Ensure the file exists and is free of syntax errors.');
    TABS = CONFIG.tabs;
    if (!TABS?.length) throw new Error('CONFIG.tabs is missing or empty.');
  } catch (e) {
    console.warn('Aerodash:', e.message);
    TABS = [{ name: 'Home', groups: [] }];
    configErrorEl.innerHTML = '⚠ Aerodash couldn\'t load your configuration. Please ensure config.js exists and is free of syntax errors. If issues persist, check the <a href="https://github.com/Aerowinder/aerodash/blob/main/README.md" target="_blank" rel="noopener noreferrer">readme</a> or <a href="https://github.com/Aerowinder/aerodash/issues" target="_blank" rel="noopener noreferrer">open an issue on GitHub</a>.';
    configErrorEl.style.display = 'block';
  }

  // ── TABS ──
  let activeTab = Math.max(0, Math.min(parseInt(localStorage.getItem('ad-tab'), 10) || 0, TABS.length - 1));

  function renderGroups(groups, container) {
    if (!groups?.length) return;
    const frag = document.createDocumentFragment();
    groups.forEach(entry => {
      if (entry.divider) {
        frag.appendChild(el('div', { className: 'card-divider' }));
        return;
      }
      const g    = el('div', { className: 'card-group' });
      const list = el('div', { className: 'card-list' });
      g.appendChild(el('div', { className: 'group-title', textContent: entry.name }));
      g.appendChild(list);
      const isNew = (ROOT.getAttribute('data-links') || 'new') === 'new';
      (entry.cards || []).forEach(({ name, url, icon }) => {
        const a = el('a', { href: url, className: 'card-item', target: isNew ? '_blank' : '_self', rel: isNew ? 'noopener noreferrer' : '' });
        const iconDiv = el('div', { className: 'card-icon' });
        if (icon) {
          const img = Object.assign(document.createElement('img'), { src: icon, alt: '', loading: 'lazy' });
          img.onerror = () => iconDiv.remove();
          iconDiv.appendChild(img);
          a.appendChild(iconDiv);
        }
        a.appendChild(el('span', { className: 'card-name', textContent: name }));
        list.appendChild(a);
      });
      frag.appendChild(g);
    });
    container.appendChild(frag);
  }

  function buildTabs() {
    if (TABS.length <= 1) { tabBarEl.style.display = 'none'; return; }
    tabBarEl.style.display = 'flex';
    tabBarEl.innerHTML = '';
    TABS.forEach((tab, i) => {
      const b = el('button', { className: 'tab-btn' + (i === activeTab ? ' active' : ''), textContent: tab.name, role: 'tab', 'aria-selected': i === activeTab });
      b.onclick = () => switchTab(i);
      tabBarEl.appendChild(b);
    });
  }

  function switchTab(index) {
    activeTab = index;
    localStorage.setItem('ad-tab', index);
    buildTabs();
    renderTab(index);
  }

  function renderTab(index) {
    cardGroupsEl.innerHTML = '';
    renderGroups((TABS[index] || TABS[0]).groups, cardGroupsEl);
    cardGroupsEl.querySelectorAll('.card-group, .card-divider').forEach((g, i) => { g.style.animationDelay = (0.04 + i * 0.04) + 's'; });
    applyLayout();
  }

  // ── LAYOUT ──
  let CARD_W      = parseFloat(localStorage.getItem('ad-card-w') || '10');
  const GAP_HMODE = 0.3;   // gap used in horizontal mode (between cards in a row)
  const GAP_VMODE = 1.0;   // gap used in vertical mode (between group columns)
  const ROOT_FONT = 20;    // matches html { font-size: 20px } in CSS — never changes
  const rem2px    = r => r * ROOT_FONT;
  const fmt       = v => parseFloat(v).toFixed(1);

  // ── THEMES ──
  const THEMES = {
    dark: [
      { id: 'dark-gray',    color: '#5a6878', label: 'Dark Gray'    },
      { id: 'dark-blue',    color: '#1848a0', label: 'Dark Blue'    },
      { id: 'dark-orange',  color: '#904000', label: 'Dark Orange'  },
      { id: 'dark-green',   color: '#0a6040', label: 'Dark Green'   },
      { id: 'dark-red',     color: '#901030', label: 'Dark Red'     },
      { id: 'dark-purple',  color: '#501888', label: 'Dark Purple'  },
    ],
    light: [
      { id: 'light-gray',   color: '#9aaabb', label: 'Light Gray'   },
      { id: 'light-blue',   color: '#5a98f0', label: 'Light Blue'   },
      { id: 'light-orange', color: '#e09050', label: 'Light Orange' },
      { id: 'light-green',  color: '#40c898', label: 'Light Green'  },
      { id: 'light-red',    color: '#e05070', label: 'Light Red'    },
      { id: 'light-purple', color: '#a878e8', label: 'Light Purple' },
    ]
  };

  function applyCardWidth(w) {
    CARD_W = w;
    ROOT.style.setProperty('--card-w', w + 'rem');
    localStorage.setItem('ad-card-w', w);
  }

  function applyCardHeight(h) {
    ROOT.style.setProperty('--card-h', h + 'rem');
    localStorage.setItem('ad-card-h', h);
  }

  function applyLayout() {
    const colTarget = parseInt(localStorage.getItem('ad-columns') || '10', 10);
    const isH       = ROOT.getAttribute('data-layout') === 'horizontal';
    const gap       = isH ? GAP_HMODE : GAP_VMODE;
    const availRem  = window.innerWidth / ROOT_FONT - 3;
    const fits      = Math.max(1, Math.floor((availRem + gap) / (CARD_W + gap)));

    let itemCap;
    if (isH) {
      // Horizontal: cap by the longest group (most items in a single row)
      const lists = cardGroupsEl.querySelectorAll('.card-list');
      itemCap = lists.length ? Math.max(...Array.from(lists, l => l.children.length)) : Infinity;
    } else {
      // Vertical: cap by the largest run of groups between dividers
      // e.g. 4 groups, divider, 4 groups → cap is 4, not 8
      let max = 0, run = 0;
      for (const c of cardGroupsEl.children) {
        if (c.classList.contains('card-divider')) { max = Math.max(max, run); run = 0; }
        else if (c.classList.contains('card-group')) { run++; }
      }
      itemCap = Math.max(max, run) || colTarget;
    }

    const cols = Math.min(colTarget, fits, itemCap);
    contentEl.style.width = rem2px(cols * CARD_W + (cols - 1) * gap) + 'px';
  }

  let resizePending = false;
  window.addEventListener('resize', () => {
    if (!resizePending) {
      resizePending = true;
      requestAnimationFrame(() => { applyLayout(); resizePending = false; });
    }
  });

  // ── OPTIONS PANEL ──
  function applyTheme(id) {
    ROOT.setAttribute('data-theme', id);
    localStorage.setItem('ad-theme', id);
  }

  function optRow(label, values, active, attr, key, extra) {
    const row = el('div', { className: 'opt-row' });
    row.appendChild(el('span', { className: 'opt-label', textContent: label }));
    values.forEach(([display, value]) => {
      const b = el('button', { className: 'pal-btn' + (active === value ? ' active' : ''), textContent: display });
      b.onclick = () => {
        ROOT.setAttribute(attr, value);
        localStorage.setItem(key, value);
        if (extra) extra();
        buildOptions();
      };
      row.appendChild(b);
    });
    return row;
  }

  function sliderRow(label, opts, onChange, fmtLabel) {
    const row    = el('div',   { className: 'opt-row' });
    const slider = el('input', { type: 'range', ...opts, className: 'opt-slider' });
    const fmtFn  = fmtLabel || fmt;
    const lbl    = el('span',  { className: 'opt-val-label', textContent: fmtFn(opts.value) });
    slider.oninput  = () => { lbl.textContent = fmtFn(slider.value); };
    slider.onchange = () => { lbl.textContent = fmtFn(slider.value); onChange(slider.value); };
    row.appendChild(el('span', { className: 'opt-label', textContent: label }));
    row.appendChild(slider);
    row.appendChild(lbl);
    return row;
  }

  function section(title, noBorder) {
    const s = el('div', { className: 'opt-section' + (noBorder ? ' no-border' : '') });
    s.appendChild(el('span', { className: 'opt-section-title', textContent: title }));
    return s;
  }

  function buildOptions() {
    const theme = ROOT.getAttribute('data-theme') || 'dark-gray';
    const cols  = parseInt(localStorage.getItem('ad-columns') || '10', 10);
    const cardH = parseFloat(localStorage.getItem('ad-card-h') || '3');
    optionsFlyEl.innerHTML = '';

    // HEADER
    const header = el('div', { className: 'flyout-header' });
    header.appendChild(el('span', { className: 'flyout-header-title', textContent: 'Aerodash ' + VERSION }));
    const ghLink = el('a', { className: 'flyout-header-link', textContent: 'GitHub', href: 'https://github.com/Aerowinder/aerodash', target: '_blank', rel: 'noopener noreferrer' });
    header.appendChild(ghLink);
    optionsFlyEl.appendChild(header);

    // THEME
    const themeSection = section('THEME', true);
    ['dark', 'light'].forEach(group => {
      const row = el('div', { className: 'opt-row' });
      row.appendChild(el('span', { className: 'opt-label', textContent: group.toUpperCase() }));
      const swatchRow = el('div', { className: 'swatch-row' });
      THEMES[group].forEach(t => {
        const s = el('button', { className: 'swatch' + (t.id === theme ? ' active' : ''), title: t.label });
        s.style.background = t.color;
        s.onclick = () => { applyTheme(t.id); buildOptions(); };
        swatchRow.appendChild(s);
      });
      row.appendChild(swatchRow);
      themeSection.appendChild(row);
    });
    optionsFlyEl.appendChild(themeSection);

    // MISC
    const misc = section('MISC');
    misc.appendChild(optRow('LINKS', [['new tab','new'],['same tab','same']], ROOT.getAttribute('data-links') || 'new', 'data-links', 'ad-links', () => renderTab(activeTab)));
    optionsFlyEl.appendChild(misc);

    // DISPLAY
    const display = section('DISPLAY');
    display.appendChild(optRow('ANIMATION', [['off','off'],['on','on']],                   ROOT.getAttribute('data-anim')    || 'on',  'data-anim',    'ad-animation'));
    display.appendChild(optRow('GLOW',      [['off','off'],['low','low'],['med','med'],['high','high']], ROOT.getAttribute('data-glow')    || 'off', 'data-glow',    'ad-glow'));
    display.appendChild(optRow('GRID',      [['off','off'],['on','on']],                   ROOT.getAttribute('data-grid')    || 'off', 'data-grid',    'ad-grid'));
    display.appendChild(optRow('ICONS',     [['off','off'],['on','on']],                   ROOT.getAttribute('data-icons')   || 'on',  'data-icons',   'ad-icons'));
    display.appendChild(optRow('STEALTH',   [['off','off'],['on','on']],                   ROOT.getAttribute('data-stealth') || 'off', 'data-stealth', 'ad-stealth'));
    optionsFlyEl.appendChild(display);

    // CARD LAYOUT
    const layout = section('CARD LAYOUT');
    layout.appendChild(optRow('VIEW',  [['horizontal','horizontal'],['vertical','vertical']], ROOT.getAttribute('data-layout') || 'horizontal', 'data-layout', 'ad-view', applyLayout));
    layout.appendChild(sliderRow('COLUMNS', { min: 1,   max: 20,  value: cols,  step: 1   }, v => { localStorage.setItem('ad-columns', v); applyLayout(); }));
    // Height slider runs on integers internally (value * 2) to avoid browser float
    // snap point ambiguity with fractional min/step values (e.g. min:1.5, step:0.5
    // causes 3.0 to snap to 3.5 due to floating point rounding in some browsers).
    // The label formatter and onChange divide by 2 to restore the real rem value.
    layout.appendChild(sliderRow('HEIGHT',  { min: 2,  max: 10,  value: Math.round(cardH * 2), step: 1 }, v => { applyCardHeight(parseInt(v, 10) / 2); }, v => fmt(parseInt(v, 10) / 2)));
    // Same integer trick as height — 0.5 step sliders can snap incorrectly due to
    // floating point precision in some browsers. Multiply by 2 to use integer steps.
    layout.appendChild(sliderRow('WIDTH',   { min: 10, max: 40,  value: Math.round(CARD_W * 2), step: 1 }, v => { applyCardWidth(parseInt(v, 10) / 2); applyLayout(); }, v => fmt(parseInt(v, 10) / 2)));
    optionsFlyEl.appendChild(layout);
  }

  function toggleOptions(e) {
    e.stopPropagation();
    if (optionsFlyEl.classList.contains('open')) {
      optionsFlyEl.classList.remove('open');
      return;
    }
    buildOptions();
    // Clear stale positioning, then measure true scrollHeight
    optionsFlyEl.classList.remove('flipped');
    optionsFlyEl.style.visibility = 'hidden';
    optionsFlyEl.classList.add('open');
    requestAnimationFrame(() => {
      const btnRect = optionsBtnEl.getBoundingClientRect();
      optionsFlyEl.classList.toggle('flipped', btnRect.top < optionsFlyEl.scrollHeight + 20);
      optionsFlyEl.style.visibility = '';
    });
  }

  optionsBtnEl.addEventListener('click', toggleOptions);

  document.addEventListener('click', e => {
    if (!e.target.closest('.options-wrap'))
      optionsFlyEl.classList.remove('open');
  });

  // ── INIT ──
  // Attributes already restored in <head>; here we run DOM-dependent functions.
  (function () {
    applyCardWidth(parseFloat(localStorage.getItem('ad-card-w') || '10'));
    applyCardHeight(parseFloat(localStorage.getItem('ad-card-h') || '3'));
    buildTabs();
    renderTab(activeTab);
  })();

</script>
</body>
</html>
