<!DOCTYPE html>
<html lang="en" data-theme="dark" data-layout="horizontal" data-grid="off" data-glow="off" data-links="new" data-icons="on" data-anim="on">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./icons/aerodash.svg">
<title>Aerodash</title>
<script src="./config.js"></script>
<script>
  // Apply saved settings before first paint to prevent flash
  (function() {
    const h = document.documentElement;
    ['theme','layout','grid','glow','links','icons','anim'].forEach(a => {
      const v = localStorage.getItem('hp-' + a);
      if (v) h.setAttribute('data-' + a, v);
    });
    // Block transitions during initial render to prevent theme flash
    h.classList.add('no-transition');
    requestAnimationFrame(() => requestAnimationFrame(() => h.classList.remove('no-transition')));
  })();
</script>

  /* ── BASE ── */
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
    transition: background 0.25s, color 0.25s;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 2.5rem 2.5rem;
    transition: opacity 0.25s;
  }
  [data-grid="off"] body::before { opacity: 0; }

  /* ── GLOW ── */
  .glow {
    position: fixed; top: -12rem; left: 50%; transform: translateX(-50%);
    width: 37.5rem; height: 37.5rem; border-radius: 50%;
    background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
    pointer-events: none; z-index: 0; transition: opacity 0.25s;
  }
  [data-glow="off"]  .glow { opacity: 0; }
  [data-glow="low"]  .glow { opacity: 0.4; }
  [data-glow="high"] .glow { opacity: 3; }

  /* ── PAGE ── */
  .wrapper {
    position: relative; z-index: 1;
    padding: 2rem 1.5rem 3rem;
  }
  .content { margin: 0 auto; }

  /* ── BOTTOMBAR ── */
  .bottombar {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    padding: 0.7rem 1.5rem;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
    transition: border-color 0.25s;
  }

  /* ── TABBAR ── */
  .tabbar {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.4rem;
    transition: border-color 0.25s;
  }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em;
    color: var(--muted); padding: 0.2rem 0.4rem; border-radius: 0.25rem;
    transition: color 0.15s;
  }
  .tab-btn:hover { color: var(--accent2); }
  .tab-btn.active { color: var(--text); }
  .ctrl-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.82rem; line-height: 1;
    padding: 0.1rem 0.15rem; border-radius: 0.25rem;
    transition: color 0.15s;
  }
  .ctrl-btn:hover { color: var(--accent2); }

  /* ── OPTIONS FLYOUT ── */
  .options-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
  .options-flyout {
    position: absolute; bottom: calc(100% + 0.6rem); left: 50%; transform: translateX(-50%);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 0.6rem; padding: 0.6rem 0.8rem;
    display: flex; flex-direction: column; gap: 0.45rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
    transform: translateX(-50%) translateY(4px);
    z-index: 200; min-width: 16rem;
  }
  .options-flyout.open {
    opacity: 1; pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .options-flyout.flipped {
    bottom: auto; top: calc(100% + 0.6rem);
    transform: translateX(-50%) translateY(-4px);
  }
  .options-flyout.flipped.open {
    transform: translateX(-50%) translateY(0);
  }
  .opt-row { display: flex; align-items: center; gap: 0.4rem; }
  .opt-label {
    font-size: 0.62rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
    width: 4.5rem; flex-shrink: 0;
  }
  .swatch-row { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .theme-wrap { display: flex; flex-direction: column; gap: 0.25rem; }
  .swatch {
    width: 1.1rem; height: 1.1rem; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
    transition: transform 0.12s, border-color 0.12s;
    flex-shrink: 0;
  }
  .swatch:hover { transform: scale(1.2); }
  .swatch.active { border-color: #fff; }
  [data-theme^="light"] .swatch.active { border-color: #000; }

  /* ── OPTIONS BUTTONS ── */
  .pal-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); border-radius: 0.3rem;
    font-size: 0.6rem; font-weight: 500; cursor: pointer;
    padding: 0.18rem 0.35rem; white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .pal-btn:hover { background: var(--surface-hover); color: var(--text); }
  .pal-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── OPTIONS SLIDERS ── */
  .opt-slider {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 3px; border-radius: 2px;
    background: var(--border); outline: none; cursor: pointer;
  }
  .opt-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent2); cursor: pointer;
    box-shadow: 0 0 5px var(--accent);
  }
  .opt-slider::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent2); cursor: pointer;
    border: none; box-shadow: 0 0 5px var(--accent);
  }
  .opt-col-label {
    font-size: 0.62rem; color: var(--muted);
    font-variant-numeric: tabular-nums; font-weight: 500;
    width: 1.8rem; flex-shrink: 0; text-align: right;
  }

  :root { --card-w: 15rem; }

  /* ── SHARED ── */
  .group-title {
    font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); font-weight: 500; margin-bottom: 0.5rem; padding-left: 0.15rem;
  }

  /* ── SERVICE ITEMS ── */
  .service-item {
    display: flex; align-items: center; gap: 0.6rem;
    width: var(--card-w); padding: 0.6rem 0.75rem; min-height: 3rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0.5rem; text-decoration: none; color: var(--text);
    white-space: nowrap; overflow: hidden;
    transition: background 0.15s, border-color 0.15s;
  }
  .service-item:hover {
    background: var(--surface-hover); border-color: var(--border-focus);
  }
  .service-icon {
    width: 1.75rem; height: 1.75rem; border-radius: 0.35rem; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
  }
  .service-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 0.2rem; }
  .service-name { font-size: 0.8rem; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }

  [data-icons="off"] .service-icon,
  [data-icons="off"] .bookmark-favicon,
  [data-icons="off"] .icon-qmark { display: none; width: 0; margin: 0; }

  /* ── VERTICAL LAYOUT ── */
  .service-groups {
    display: flex; flex-wrap: wrap;
    gap: 1rem; padding-top: 1.2rem; margin-bottom: 1.6rem;
  }
  .service-list { display: flex; flex-direction: column; gap: 0.3rem; }

  /* ── HORIZONTAL LAYOUT ── */
  [data-layout="horizontal"] .service-groups { flex-direction: column; gap: 1.2rem; }
  [data-layout="horizontal"] .service-group  { width: 100% !important; }
  [data-layout="horizontal"] .service-list   { flex-direction: row; flex-wrap: wrap; gap: 0.3rem; }
  [data-layout="horizontal"] .group-title    { margin-bottom: 0.5rem; }

  /* ── BOOKMARKS ── */
  .bookmarks-grid { display: flex; flex-wrap: wrap; gap: 1rem; align-content: flex-start; }
  .bookmark-group { width: var(--card-w); flex-shrink: 0; }
  .bookmark-list  { display: flex; flex-direction: column; gap: 0.3rem; }
  [data-layout="horizontal"] .bookmark-group { width: 100%; flex-shrink: 1; }
  [data-layout="horizontal"] .bookmark-list { flex-direction: row; flex-wrap: wrap; gap: 0.3rem; }

  .bookmark-item {
    display: flex; align-items: center; gap: 0.45rem;
    width: var(--card-w); padding: 0.44rem 0.55rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0.35rem; text-decoration: none; color: var(--text);
    font-size: 0.78rem; font-weight: 400;
    white-space: nowrap; overflow: hidden;
    transition: background 0.15s, border-color 0.15s;
  }
  .bookmark-item:hover { background: var(--surface-hover); border-color: var(--border-focus); }
  .bookmark-favicon { width: 0.8rem; height: 0.8rem; border-radius: 0.12rem; object-fit: contain; flex-shrink: 0; }
  .icon-qmark-bm { width: 0.8rem; height: 0.8rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; }
  .bm-label { overflow: hidden; text-overflow: ellipsis; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .bottombar        { animation: fadeUp .35s 0.00s both; opacity: 0; transform: translateY(6px); }
  .service-group,
  .bookmark-group   { opacity: 0; transform: translateY(6px); animation: fadeUp .35s both; }
  [data-anim="off"] .service-group,
  [data-anim="off"] .bookmark-group,
  [data-anim="off"] .bottombar { animation: none; opacity: 1; transform: none; }

  /* ── CONFIG ERROR ── */
  .config-error {
    margin: 0 auto 1rem; padding: 0.6rem 0.9rem;
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4);
    border-radius: 0.5rem; color: #f87171;
    font-size: 0.72rem; font-weight: 500; width: fit-content;
  }
  .config-error a { color: #f87171; text-decoration: underline; }

  /* ── OPTIONS BTN ── */
  .options-btn {
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.05em; padding: 0.2rem 0.4rem;
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrapper">

  <div id="configError" class="config-error" style="display:none"></div>

  <div class="content" id="content">

  <div class="tabbar" id="tabBar" style="display:none"></div>

  <div class="service-groups" id="serviceGroups"></div>

  <div class="bookmarks-grid" id="bookmarksGrid"></div>

  <header class="bottombar">
    <div class="options-wrap">
      <button class="ctrl-btn options-btn" id="optionsBtn" onclick="toggleOptions(event)">OPTIONS</button>
      <div style="font-size:0.52rem;color:var(--muted);text-align:center;margin-top:0.15rem;letter-spacing:0.04em;">Aerodash - v2026.03.16c</div>
      <div class="options-flyout" id="optionsFlyout"></div>
    </div>
  </header>

  </div><!-- /content -->

</div><!-- /wrapper -->

<script>
  // ── FALLBACKS ──
  function qmark() {
    return Object.assign(document.createElement('span'), { className: 'icon-qmark', textContent: '?' });
  }
  function qmarkBm() {
    return Object.assign(document.createElement('span'), { className: 'icon-qmark icon-qmark-bm', textContent: '?' });
  }

  // ── PAGES ──
  let LINK_ELS = [];
  let SERVICE_GROUP_COUNT = 0;
  let PAGES;
  try {
    if (typeof CONFIG === 'undefined') throw new Error('config.js did not load — check the file exists and has no syntax errors.');
    PAGES = CONFIG.pages;
    if (!PAGES?.length) throw new Error('CONFIG.pages is missing or empty.');
  } catch(e) {
    console.warn('Aerodash:', e.message);
    PAGES = [{ name: 'Home', services: [], bookmarks: [] }];
    const err = document.getElementById('configError');
    if (err) {
      err.innerHTML = '⚠ Aerodash couldn\'t load your configuration. Please ensure config.js exists and is free of syntax errors. If issues persist, check the <a href="https://github.com/Aerowinder/aerodash/blob/main/README.md" target="_blank" rel="noopener noreferrer">readme</a> or <a href="https://github.com/Aerowinder/aerodash/issues" target="_blank" rel="noopener noreferrer">open an issue on GitHub</a>.';
      err.style.display = 'block';
    }
  }
  let activePage = Math.min(parseInt(localStorage.getItem('hp-page') || '0'), PAGES.length - 1);

  function renderServices(services, container) {
    if (!services?.length) return;
    services.forEach(({ group, items }) => {
      const g = el('div', { className: 'service-group' });
      g.appendChild(el('div', { className: 'group-title', textContent: group }));
      const list = el('div', { className: 'service-list' });
      items.forEach(({ name, url, icon }) => {
        const a = el('a', { href: url, className: 'service-item' });
        const iconDiv = el('div', { className: 'service-icon' });
        if (icon) {
          const img = Object.assign(document.createElement('img'), { src: icon, alt: '', loading: 'lazy' });
          img.onerror = () => img.replaceWith(qmark());
          iconDiv.appendChild(img);
        }
        a.appendChild(iconDiv);
        a.appendChild(el('span', { className: 'service-name', textContent: name }));
        list.appendChild(a);
      });
      g.appendChild(list);
      container.appendChild(g);
    });
  }

  function renderBookmarks(bookmarks, container) {
    if (!bookmarks?.length) return;
    bookmarks.forEach(({ group, items }) => {
      const g = el('div', { className: 'bookmark-group' });
      g.appendChild(el('div', { className: 'group-title', textContent: group }));
      const list = el('div', { className: 'bookmark-list' });
      items.forEach(({ name, url, icon }) => {
        const a = el('a', { href: url, className: 'bookmark-item' });
        if (icon) {
          const img = Object.assign(document.createElement('img'), { src: icon, alt: '', loading: 'lazy', className: 'bookmark-favicon' });
          img.onerror = () => img.replaceWith(qmarkBm());
          a.appendChild(img);
        }
        a.appendChild(el('span', { className: 'bm-label', textContent: name }));
        list.appendChild(a);
      });
      g.appendChild(list);
      container.appendChild(g);
    });
  }

  function buildTabs() {
    const bar = document.getElementById('tabBar');
    if (PAGES.length <= 1) { bar.style.display = 'none'; return; }
    bar.style.display = 'flex';
    bar.innerHTML = '';
    PAGES.forEach((page, i) => {
      const b = el('button', { className: 'tab-btn' + (i === activePage ? ' active' : ''), textContent: page.name });
      b.onclick = () => switchPage(i);
      bar.appendChild(b);
    });
  }

  function switchPage(index) {
    activePage = index;
    localStorage.setItem('hp-page', index);
    buildTabs();
    renderPage(index);
  }

  function renderPage(index) {
    const page = PAGES[index] || PAGES[0];
    document.getElementById('serviceGroups').innerHTML = '';
    document.getElementById('bookmarksGrid').innerHTML  = '';
    renderServices(page.services, document.getElementById('serviceGroups'));
    renderBookmarks(page.bookmarks, document.getElementById('bookmarksGrid'));

    const allGroups = document.querySelectorAll('.service-group, .bookmark-group');
    const svcGroups = document.querySelectorAll('.service-group');

    // Stagger animation delays across all groups in sequence
    allGroups.forEach((g, i) => { g.style.animationDelay = (0.04 + i * 0.04) + 's'; });

    LINK_ELS            = Array.from(document.querySelectorAll('.service-item, .bookmark-item'));
    SERVICE_GROUP_COUNT = svcGroups.length;
    applyLinks();
    applyLayout();
  }

  // ── LAYOUT SIZING ──
  let CARD_W = parseFloat(localStorage.getItem('hp-card-w') || '15');
  const GAP_GROUP    = 1.0, GAP_CARD = 0.3;
  const ROOT_FONT    = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const rem2px       = r => r * ROOT_FONT;
  const fmtCardWidth = v => parseFloat(v).toFixed(1);

  function applyCardWidth(w) {
    CARD_W = w;
    document.documentElement.style.setProperty('--card-w', w + 'rem');
    localStorage.setItem('hp-card-w', w);
  }

  function applyLayout() {
    const colTarget    = parseInt(localStorage.getItem('hp-cols') || '5');
    const isHorizontal = document.documentElement.getAttribute('data-layout') === 'horizontal';
    const gap          = isHorizontal ? GAP_CARD : GAP_GROUP;
    const avail        = document.documentElement.clientWidth - rem2px(3);
    const fits         = Math.max(1, Math.floor((avail + rem2px(gap)) / (rem2px(CARD_W) + rem2px(gap))));
    const serviceLists = Array.from(document.querySelectorAll('.service-list'));
    const itemCap      = isHorizontal
      ? (serviceLists.length ? Math.max(...serviceLists.map(l => l.children.length)) : 1)
      : SERVICE_GROUP_COUNT;
    const cols = Math.min(colTarget, fits, itemCap);
    document.getElementById('content').style.width = (cols * rem2px(CARD_W) + (cols - 1) * rem2px(gap)) + 'px';
  }
  window.addEventListener('resize', applyLayout);

  // ── OPTIONS PANEL ──
  const THEMES = {
    dark: [
      // Row 1: neutrals → cool blues
      { id: 'dark',          color: '#475569', label: 'Dark' },
      { id: 'dark-charcoal', color: '#3a3a3a', label: 'Dark Charcoal' },
      { id: 'dark-slate',    color: '#334155', label: 'Dark Slate' },
      { id: 'dark-navy',     color: '#1e3a5f', label: 'Dark Navy' },
      { id: 'dark-blue',     color: '#3b82f6', label: 'Dark Blue' },
      { id: 'dark-teal',     color: '#14b8a6', label: 'Dark Teal' },
      // Row 2: greens → warm → purple
      { id: 'dark-forest',   color: '#166534', label: 'Dark Forest' },
      { id: 'dark-green',    color: '#22c55e', label: 'Dark Green' },
      { id: 'dark-warm',     color: '#f97316', label: 'Dark Warm' },
      { id: 'dark-red',      color: '#ef4444', label: 'Dark Red' },
      { id: 'dark-rose',     color: '#f43f5e', label: 'Dark Rose' },
      { id: 'dark-purple',   color: '#a855f7', label: 'Dark Purple' },
    ],
    light: [
      // Row 1: neutrals → warm
      { id: 'light',         color: '#cbd5e1', label: 'Light' },
      { id: 'light-stone',   color: '#d6d3d1', label: 'Light Stone' },
      { id: 'light-cream',   color: '#fef08a', label: 'Light Cream' },
      { id: 'light-warm',    color: '#fdba74', label: 'Light Warm' },
      { id: 'light-peach',   color: '#fed7aa', label: 'Light Peach' },
      { id: 'light-rose',    color: '#fda4af', label: 'Light Rose' },
      // Row 2: purples → cool
      { id: 'light-lavender',color: '#ddd6fe', label: 'Light Lavender' },
      { id: 'light-purple',  color: '#d8b4fe', label: 'Light Purple' },
      { id: 'light-blue',    color: '#93c5fd', label: 'Light Blue' },
      { id: 'light-teal',    color: '#5eead4', label: 'Light Teal' },
      { id: 'light-mint',    color: '#a7f3d0', label: 'Light Mint' },
      { id: 'light-green',   color: '#86efac', label: 'Light Green' },
    ]
  };

  // Render themes as 2 rows of 6 swatches
  function themeRows(group, activeTheme) {
    const wrap = el('div', { className: 'theme-wrap' });
    for (let r = 0; r < 2; r++) {
      const row = el('div', { className: 'swatch-row' });
      THEMES[group].slice(r * 6, r * 6 + 6).forEach(themeEntry => {
        const swatch = el('button', { className: 'swatch' + (themeEntry.id === activeTheme ? ' active' : ''), title: themeEntry.label });
        swatch.style.background = themeEntry.color;
        swatch.onclick = () => { applyTheme(themeEntry.id); buildOptions(); };
        row.appendChild(swatch);
      });
      wrap.appendChild(row);
    }
    return wrap;
  }

  function el(tag, props) {
    return Object.assign(document.createElement(tag), props);
  }
  function btn(text, active, onclick) {
    const b = el('button', { className: 'pal-btn' + (active ? ' active' : ''), textContent: text });
    b.onclick = onclick;
    return b;
  }

  // Builds a labeled row of toggle buttons in the options flyout
  function optRow(label, values, active, attr, storageKey, extraAction) {
    const row = el('div', { className: 'opt-row' });
    row.appendChild(el('span', { className: 'opt-label', textContent: label }));
    values.forEach(([display, value]) => {
      row.appendChild(btn(display, active === value, () => {
        document.documentElement.setAttribute(attr, value);
        localStorage.setItem(storageKey, value);
        if (extraAction) extraAction();
        buildOptions();
      }));
    });
    return row;
  }

  function buildOptions() {
    const flyout = document.getElementById('optionsFlyout');
    const html   = document.documentElement;
    const theme  = html.getAttribute('data-theme')  || 'dark';
    const cols   = parseInt(localStorage.getItem('hp-cols') || '5');
    flyout.innerHTML = '';

    // THEMES — dark then light
    ['dark','light'].forEach(group => {
      const row = el('div', { className: 'opt-row' });
      row.appendChild(el('span', { className: 'opt-label', textContent: group === 'dark' ? 'Dark' : 'Light' }));
      row.appendChild(themeRows(group, theme));
      flyout.appendChild(row);
    });

    flyout.appendChild(optRow('Icons',  [['off','off'],['on','on']],            html.getAttribute('data-icons')  ||'on',         'data-icons',  'hp-icons'));
    flyout.appendChild(optRow('Anim',   [['off','off'],['on','on']],            html.getAttribute('data-anim')   ||'on',         'data-anim',   'hp-anim'));
    flyout.appendChild(optRow('Grid',   [['off','off'],['on','on']],            html.getAttribute('data-grid')   ||'off',        'data-grid',   'hp-grid'));
    flyout.appendChild(optRow('Glow',   [['off','off'],['low','low'],['high','high']], html.getAttribute('data-glow')||'off',     'data-glow',   'hp-glow'));
    flyout.appendChild(optRow('Mode',   [['horizontal','horizontal'],['vertical','vertical']], html.getAttribute('data-layout')||'horizontal', 'data-layout', 'hp-layout', applyLayout));
    flyout.appendChild(optRow('Links',  [['new tab','new'],['same tab','same']], html.getAttribute('data-links') ||'new',        'data-links',  'hp-links',  applyLinks));

    // CARD COLS
    const colRow    = el('div', { className: 'opt-row' });
    const colSlider = el('input', { type: 'range', min: 1, max: 10, value: cols, className: 'opt-slider', title: 'Adjust column count' });
    const colLbl    = el('span',  { className: 'opt-col-label', textContent: cols });
    colSlider.oninput  = () => { colLbl.textContent = colSlider.value; };
    colSlider.onchange = () => { localStorage.setItem('hp-cols', colSlider.value); applyLayout(); buildOptions(); };
    colRow.appendChild(el('span', { className: 'opt-label', textContent: 'Card Cols' }));
    colRow.appendChild(colSlider);
    colRow.appendChild(colLbl);
    flyout.appendChild(colRow);

    // CARD WIDTH
    const cardW    = parseFloat(localStorage.getItem('hp-card-w') || '15');
    const cwRow    = el('div', { className: 'opt-row' });
    const cwSlider = el('input', { type: 'range', min: 10, max: 20, value: cardW, step: 0.5, className: 'opt-slider', title: 'Adjust card width' });
    const cwLbl    = el('span',  { className: 'opt-col-label', textContent: fmtCardWidth(cardW) });
    cwSlider.oninput  = () => { cwLbl.textContent = fmtCardWidth(cwSlider.value); };
    cwSlider.onchange = () => { applyCardWidth(parseFloat(cwSlider.value)); applyLayout(); buildOptions(); };
    cwRow.appendChild(el('span', { className: 'opt-label', textContent: 'Card Width' }));
    cwRow.appendChild(cwSlider);
    cwRow.appendChild(cwLbl);
    flyout.appendChild(cwRow);
  }

  function applyLinks() {
    const isNew = (document.documentElement.getAttribute('data-links') || 'new') === 'new';
    LINK_ELS.forEach(a => {
      a.target = isNew ? '_blank' : '_self';
      a.rel    = isNew ? 'noopener noreferrer' : '';
    });
  }

  function applyTheme(id) {
    document.documentElement.setAttribute('data-theme', id);
    localStorage.setItem('hp-theme', id);
  }

  function toggleOptions(e) {
    e.stopPropagation();
    buildOptions();
    const flyout     = document.getElementById('optionsFlyout');
    const btnRect    = document.getElementById('optionsBtn').getBoundingClientRect();
    const flyoutH    = flyout.scrollHeight + 20;
    flyout.classList.toggle('flipped', btnRect.top < flyoutH);
    flyout.classList.toggle('open');
  }

  // Close only when clicking outside the options wrap
  document.addEventListener('click', e => {
    if (!e.target.closest('.options-wrap'))
      document.getElementById('optionsFlyout').classList.remove('open');
  });

  // ── RESTORE ──
  // Attributes already applied in <head> to prevent flash.
  // Here we just run the functions that depend on the DOM being ready.
  (function () {
    const cw = localStorage.getItem('hp-card-w');
    applyCardWidth(cw ? parseFloat(cw) : 15);
    buildTabs();
    renderPage(activePage);
  })();
</script>
</body>
</html>
