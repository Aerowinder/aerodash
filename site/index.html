<!DOCTYPE html>
<html lang="en" data-theme="dark-midnight" data-layout="horizontal" data-grid="off" data-glow="off" data-links="new" data-icons="on" data-anim="on" data-stealth="off" data-darkreader-ignore>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="./icons/aerodash.svg">
<title>Aerodash</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--base); outline-offset: 2px; }

  button { font-family: inherit; }
  .no-transition *, .no-transition *::before, .no-transition *::after { transition: none !important; }

  html { font-size: 125%; }

  /* ── THEMES ── */
  :root,
  [data-theme="dark-midnight"]  { --base:#6878a0; }
  [data-theme="dark-navy"]      { --base:#2858b8; }
  [data-theme="dark-ember"]     { --base:#c05820; }
  [data-theme="dark-forest"]    { --base:#208858; }
  [data-theme="dark-crimson"]   { --base:#c02040; }
  [data-theme="dark-amethyst"]  { --base:#8848c8; }

  [data-theme="light-fog"]      { --base:#5a6878; }
  [data-theme="light-sky"]      { --base:#1868c0; }
  [data-theme="light-sand"]     { --base:#904810; }
  [data-theme="light-sage"]     { --base:#2a7850; }
  [data-theme="light-blush"]    { --base:#a02850; }
  [data-theme="light-lavender"] { --base:#6838a8; }

  :root, [data-theme^="dark"] {
    --card-bg:     rgba(255,255,255,0.10);
    --card-bghover:rgba(255,255,255,0.15);
    --card-text:   color-mix(in srgb, var(--base) 30%, white);
    --muted:       rgb(from var(--base) r g b / 0.5);
    --site-bg:     color-mix(in srgb, var(--base) 20%, black);
    --hover-text:  #fff;
  }
  [data-theme^="light"] {
    --card-bg:     rgba(0,0,0,0.08);
    --card-bghover:rgba(0,0,0,0.13);
    --card-text:   color-mix(in srgb, var(--base) 30%, black);
    --muted:       rgb(from var(--base) r g b / 0.5);
    --site-bg:     color-mix(in srgb, var(--base) 20%, white);
    --hover-text:  #000;
  }

  /* ── BASE STYLES ── */
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300; background: var(--site-bg); color: var(--card-text);
    min-height: 100vh; overflow-x: hidden;
    transition: background 0.25s;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgb(from var(--base) r g b / 0.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgb(from var(--base) r g b / 0.06) 1px, transparent 1px);
    background-size: 2.5rem 2.5rem; transition: opacity 0.25s; opacity: 0;
  }
  [data-grid="on"] body::before { opacity: 1; }

  /* ── GLOW ── */
  .glow {
    position: fixed; top: -12rem; left: 50%; transform: translateX(-50%);
    width: 37.5rem; height: 37.5rem; border-radius: 50%;
    background: radial-gradient(circle, rgb(from var(--base) r g b / 0.08) 0%, transparent 70%);
    pointer-events: none; z-index: 0; transition: opacity 0.25s, transform 0.25s;
  }
  [data-glow="off"]  .glow { opacity: 0; }
  [data-glow="low"]  .glow { opacity: 0.9; transform: translateX(-50%) scale(2.0); }
  [data-glow="med"]  .glow { opacity: 1;   transform: translateX(-50%) scale(2.5); background: radial-gradient(circle, rgb(from var(--base) r g b / 0.12) 0%, transparent 70%); }
  [data-glow="high"] .glow { opacity: 1;   transform: translateX(-50%) scale(2.5); background: radial-gradient(circle, rgb(from var(--base) r g b / 0.18) 0%, transparent 70%); }

  /* ── LAYOUT ── */
  .wrapper  { position: relative; z-index: 1; padding: 1rem 1.5rem; }
  .content  { margin: 0 auto; }

  /* ── TOPBAR ── */
  .topbar {
    position: relative; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.6rem;
    padding: 0 1.5rem;
  }
  .topbar-tabs { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 0.6rem; }
  .tab-btn {
    background: none; border: none; cursor: pointer;
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.05em; white-space: nowrap;
    color: var(--muted); opacity: 0.85; padding: 0.2rem 0.4rem; border-radius: 0.25rem;
    transition: color 0.15s, opacity 0.15s;
  }
  .tab-btn:hover  { color: var(--hover-text); opacity: 1; }
  .tab-btn.active { color: var(--base); opacity: 1; }

  /* ── OPTIONS BUTTON ── */
  .options-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--base); line-height: 1;
    padding: 0.2rem; border-radius: 0.25rem; transition: color 0.15s;
  }
  .options-btn:hover { color: var(--hover-text); }

  /* ── OPTIONS FLYOUT ── */
  .options-wrap   { position: absolute; top: 0; right: 0; display: flex; flex-direction: column; align-items: flex-end; }
  .options-flyout {
    position: absolute; top: calc(100% + 0.6rem); right: 0;
    transform: translateY(-4px);
    background: var(--site-bg); border: 1px solid var(--base);
    border-radius: 0.6rem; padding: 0.6rem 0.8rem;
    display: flex; flex-direction: column; gap: 0.45rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    opacity: 0; pointer-events: none; z-index: 200; min-width: 16rem; max-width: calc(100vw - 2rem);
    max-height: 80vh; overflow: auto; overscroll-behavior: contain;
    transition: opacity 0.15s, transform 0.15s;
  }
  .options-flyout.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

  /* ── OPTIONS ROWS ── */
  .opt-row   { display: flex; align-items: center; gap: 0.4rem; }
  .opt-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.04em; color: var(--base); width: 4.5rem; flex-shrink: 0; }
  .opt-section {
    display: flex; flex-direction: column; gap: 0.35rem;
    padding-top: 0.45rem; border-top: 1px solid var(--muted);
  }
  .opt-section.no-border  { border-top: none; padding-top: 0; }
  .opt-section .opt-row   { padding-left: 0.4rem; min-height: 1.4rem; }
  .opt-section-title      { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--base); }
  .opt-val-label          { font-size: 0.62rem; color: var(--base); font-variant-numeric: tabular-nums; font-weight: 500; width: 2.2rem; flex-shrink: 0; text-align: right; }

  /* ── SWATCHES ── */
  .swatch-row  { display: flex; gap: 0.35rem; }
  .swatch {
    width: 1.1rem; height: 1.1rem; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; flex-shrink: 0;
    transition: transform 0.12s, border-color 0.12s;
  }
  .swatch:hover                        { transform: scale(1.2); }
  .swatch.active { border-color: var(--hover-text); }
  .opt-row.dimmed .opt-label { opacity: 0.4; } /* swatch row not currently in use */

  /* ── OPTION BUTTONS ── */
  .pal-btn {
    background: transparent; border: 1px solid var(--muted);
    color: var(--muted); border-radius: 0.3rem;
    font-size: 0.6rem; font-weight: 500; cursor: pointer;
    padding: 0.18rem 0.35rem; white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .pal-btn:hover { border-color: var(--hover-text); color: var(--hover-text); }
  .pal-btn.active { background: var(--base); border-color: var(--base); color: #fff; }

  /* ── OPTION SLIDERS ── */
  .opt-slider { -webkit-appearance: none; appearance: none; flex: 1; height: 5px; border-radius: 4px; background: var(--base); outline: none; cursor: pointer; touch-action: pan-y; }
  .opt-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--base); cursor: pointer; }
  .opt-slider::-moz-range-thumb     { width: 20px; height: 20px; border-radius: 50%; background: var(--base); cursor: pointer; border: none; }

  /* ── CARDS ── */
  :root { --card-w: 10rem; --card-h: 3rem; }

  .group-title {
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em;
    color: var(--base); margin-bottom: 0.5rem; padding-left: 0.15rem;
  }
  .card-item {
    display: flex; align-items: center; gap: 0.6rem;
    width: var(--card-w); height: var(--card-h); padding: 0.6rem 0.75rem;
    background: var(--card-bg); border: 1px solid var(--muted);
    border-radius: 0.5rem; text-decoration: none; color: var(--card-text);
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .card-item:hover { background: var(--card-bghover); border-color: var(--base); }
  .card-icon {
    width: min(calc(var(--card-h) * 0.65), 1.75rem); height: min(calc(var(--card-h) * 0.65), 1.75rem);
    border-radius: 0.35rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .card-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 0.2rem; }
  .card-name     { font-size: 0.8rem; font-weight: 400; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .card-divider  { width: 100%; border-top: 1px solid var(--muted); margin: 0.9rem 0 0.4rem; }

  [data-icons="off"] .card-icon { display: none; }

  /* ── STEALTH MODE ── */
  [data-stealth="on"] .card-item       { background: transparent; border-color: transparent; }
  [data-stealth="on"] .card-item:hover { border-color: var(--base); }

  /*
   * ── LAYOUT MODES ──
   * SYNC WARNING: The gap values here MUST match the JS constants:
   *   .card-list { gap: 0.375rem }  ↔  GAP_HMODE = 0.375
   *   .card-groups { gap: 1.5rem }  ↔  GAP_VMODE = 1.5
   * The layout engine reads the JS values to compute column widths.
   * Note: horizontal group gap is visual-only and not used in layout math.
   */
  .card-groups { display: flex; flex-wrap: wrap; align-items: flex-start; align-content: flex-start; gap: 1.5rem; padding-top: 1.5rem; margin-bottom: 1.5rem; }
  .card-list   { display: flex; flex-direction: column; gap: 0.375rem; }
  .card-group  { width: var(--card-w); }

  /* ── HORIZONTAL LAYOUT ── */
  [data-layout="horizontal"] .card-groups  { flex-direction: column; }
  [data-layout="horizontal"] .card-group   { width: 100% !important; }
  [data-layout="horizontal"] .card-list    { flex-direction: row; flex-wrap: wrap; gap: 0.375rem; }
  [data-layout="horizontal"] .group-title  { margin-bottom: 0.5rem; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .card-group,
  .card-divider { animation: fadeUp .35s both; opacity: 0; transform: translateY(6px); }
  [data-anim="off"] .card-group,
  [data-anim="off"] .card-divider { animation: none; opacity: 1; transform: none; }

  /* Must come after the animation rules above to override them. */
  @media (prefers-reduced-motion: reduce) {
    .card-group, .card-divider { animation: none; opacity: 1; transform: none; }
    *, *::before, *::after { transition-duration: 0.01ms !important; }
  }

  /* ── CONFIG ERROR ── */
  .config-error {
    display: none;
    margin: 0 auto 1rem; padding: 0.6rem 0.9rem; width: fit-content;
    background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4);
    border-radius: 0.5rem; color: #f87171; font-size: 0.72rem; font-weight: 500;
  }
  .config-error a { color: #f87171; text-decoration: underline; }

  /* ── FLYOUT HEADER ── */
  .flyout-header { display: flex; align-items: center; padding-bottom: 0.35rem; border-bottom: 1px solid var(--muted); }
  .flyout-header-title,
  .flyout-header-link  { font-size: 0.62rem; font-weight: 600; color: var(--base); letter-spacing: 0.04em; }
  .flyout-header-title { flex: 1; }
  .flyout-header-link  { text-decoration: none; }
  .flyout-header-link:hover { color: var(--card-text); }

  /* ── NARROW SCREENS ── */
  @media (max-width: 600px) {
    .topbar { flex-direction: column; padding: 0; align-items: center; }
    .options-wrap { position: static; display: flex; flex-direction: column; align-items: center; width: 100%; order: -1; }
    .topbar-tabs { width: 100%; }
    .options-flyout { position: fixed; top: 3rem; right: auto; left: 50%; transform: translateX(-50%) translateY(-4px); }
    .options-flyout.open { transform: translateX(-50%) translateY(0); }
  }
</style>

<script>
  // ── THEMES ── (defined here so saved themes can be validated before first paint)
  const THEMES = {
    dark: [
      { id: 'dark-midnight',  color: '#2e3a52', label: 'Midnight'  },
      { id: 'dark-navy',      color: '#1a3d8a', label: 'Navy'      },
      { id: 'dark-ember',     color: '#7a3010', label: 'Ember'     },
      { id: 'dark-forest',    color: '#0e5530', label: 'Forest'    },
      { id: 'dark-crimson',   color: '#7a1020', label: 'Crimson'   },
      { id: 'dark-amethyst',  color: '#4a2080', label: 'Amethyst'  },
    ],
    light: [
      { id: 'light-fog',      color: '#a8bcc8', label: 'Fog'      },
      { id: 'light-sky',      color: '#60a8f8', label: 'Sky'      },
      { id: 'light-sand',     color: '#e88030', label: 'Sand'     },
      { id: 'light-sage',     color: '#48b878', label: 'Sage'     },
      { id: 'light-blush',    color: '#e05888', label: 'Blush'    },
      { id: 'light-lavender', color: '#9868e0', label: 'Lavender' },
    ]
  };

  // localStorage wrapper that degrades to a no-op when storage is unavailable.
  // Shared with the main script below.
  const ls = (() => {
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return localStorage; }
    catch { return { getItem: () => null, setItem: () => {}, removeItem: () => {} }; }
  })();

  // Theme state: a mode (system/dark/light) plus one remembered pick per row.
  // Falls back to the pre-1.01 single 'ad-theme' key so existing users keep their theme.
  const DARK_MQ = matchMedia('(prefers-color-scheme: dark)');
  function loadThemePrefs() {
    const ids      = g => THEMES[g].map(t => t.id);
    const old      = ls.getItem('ad-theme');
    const oldGroup = ['dark', 'light'].find(g => ids(g).includes(old));
    const pick     = (g, fallback) => {
      const v = ls.getItem('ad-theme-' + g);
      return ids(g).includes(v) ? v : (oldGroup === g ? old : fallback);
    };
    const mode = ls.getItem('ad-theme-mode');
    return {
      mode:  ['system', 'dark', 'light'].includes(mode) ? mode : (oldGroup || 'system'),
      dark:  pick('dark',  'dark-midnight'),
      light: pick('light', 'light-fog'),
    };
  }
  function resolveTheme(p) {
    return p[p.mode === 'system' ? (DARK_MQ.matches ? 'dark' : 'light') : p.mode];
  }
  const themePrefs = loadThemePrefs();

  // Apply saved settings before first paint to prevent flash.
  (function() {
    const h = document.documentElement;
    h.setAttribute('data-theme', resolveTheme(themePrefs));
    // [localStorage key, html attribute, allowed values] — unknown values (e.g. from old versions) are ignored
    [
      ['ad-view',      'data-layout',  ['horizontal', 'vertical']],
      ['ad-grid',      'data-grid',    ['off', 'on']],
      ['ad-glow',      'data-glow',    ['off', 'low', 'med', 'high']],
      ['ad-links',     'data-links',   ['new', 'same']],
      ['ad-icons',     'data-icons',   ['off', 'on']],
      ['ad-animation', 'data-anim',    ['off', 'on']],
      ['ad-stealth',   'data-stealth', ['off', 'on']],
    ].forEach(([key, attr, allowed]) => {
      const v = ls.getItem(key);
      if (allowed.includes(v)) h.setAttribute(attr, v);
    });
    h.classList.add('no-transition');
    requestAnimationFrame(() => requestAnimationFrame(() => h.classList.remove('no-transition')));
  })();
</script>
</head>

<body>
<div class="glow"></div>
<div class="wrapper">

  <div class="content" id="content">
    <div class="topbar" id="topBar">
      <div class="topbar-tabs" id="topBarTabs"></div>
      <div class="options-wrap">
        <button class="options-btn" id="optionsBtn" aria-label="Options" aria-expanded="false" aria-controls="optionsFlyout">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div class="options-flyout" id="optionsFlyout" inert></div>
      </div>
    </div>
    <div class="card-groups" id="cardGroups"></div>
    <div id="configError" class="config-error"></div>
  </div>

</div>

<script src="./config.js"></script>
<script>
  const VERSION = '1.01';
  const ROOT    = document.documentElement;
  function el(tag, props) { return Object.assign(document.createElement(tag), props); }
  const isObj = v => v !== null && typeof v === 'object';

  // ── DOM REFS ──
  const cardGroupsEl  = document.getElementById('cardGroups');
  const contentEl     = document.getElementById('content');
  const topBarTabsEl  = document.getElementById('topBarTabs');
  const optionsBtnEl  = document.getElementById('optionsBtn');
  const optionsFlyEl  = document.getElementById('optionsFlyout');
  const configErrorEl = document.getElementById('configError');

  // ── CONFIG ──
  // Normalized so the rest of the code can assume: every tab has a groups array,
  // every group is a divider or has a cards array, and every card has a name.
  let TABS;
  try {
    if (typeof CONFIG === 'undefined') throw new Error('config.js is missing or contains a syntax error.');
    TABS = (Array.isArray(CONFIG.tabs) ? CONFIG.tabs : []).filter(isObj).map(tab => ({
      name:   tab.name,
      groups: (Array.isArray(tab.groups) ? tab.groups : []).filter(isObj).map(g => g.divider ? g : {
        name:  g.name,
        cards: (Array.isArray(g.cards) ? g.cards : []).filter(c => isObj(c) && c.name), // skip nameless cards
      }),
    }));
    if (!TABS.length) throw new Error('CONFIG.tabs is missing or empty.');
  } catch (e) {
    console.warn('Aerodash:', e.message);
    TABS = [{ name: 'Home', groups: [] }];
    configErrorEl.innerHTML = '⚠ Aerodash couldn\'t load your configuration: <span></span> If issues persist, check the <a href="https://github.com/Aerowinder/aerodash/blob/main/README.md" target="_blank" rel="noopener noreferrer">readme</a> or <a href="https://github.com/Aerowinder/aerodash/issues" target="_blank" rel="noopener noreferrer">open an issue on GitHub</a>.';
    configErrorEl.querySelector('span').textContent = e.message;
    configErrorEl.style.display = 'block';
  }

  // ── TABS ──
  let activeTab = Math.max(0, Math.min(parseInt(ls.getItem('ad-tab'), 10) || 0, TABS.length - 1));

  function linkAttrs() {
    const isNew = (ROOT.getAttribute('data-links') || 'new') === 'new';
    return { target: isNew ? '_blank' : '_self', rel: isNew ? 'noopener noreferrer' : '' };
  }

  function applyLinkTargets() {
    const attrs = linkAttrs();
    cardGroupsEl.querySelectorAll('.card-item').forEach(a => Object.assign(a, attrs));
  }

  function renderGroups(groups, container) {
    if (!groups.length) return;
    const frag  = document.createDocumentFragment();
    const attrs = linkAttrs();
    let animIndex = 0;
    groups.forEach(entry => {
      if (entry.divider) {
        const d = el('div', { className: 'card-divider' });
        d.style.animationDelay = (0.04 + animIndex++ * 0.04).toFixed(2) + 's';
        frag.appendChild(d);
        return;
      }
      const g    = el('div', { className: 'card-group' });
      g.style.animationDelay = (0.04 + animIndex++ * 0.04).toFixed(2) + 's';
      const list = el('div', { className: 'card-list' });
      g.appendChild(el('div', { className: 'group-title', textContent: entry.name }));
      g.appendChild(list);
      entry.cards.forEach(({ name, url, icon }) => {
        const href = url || '#'; // missing url defaults to '#'
        // icon is optional — missing or failed icons are already handled gracefully
        const a = el('a', { href: href, className: 'card-item', ...attrs });
        if (icon) {
          const iconDiv = el('div', { className: 'card-icon' });
          const img = el('img', { src: icon, alt: '', loading: 'lazy' });
          img.onerror = function() { this.onerror = null; iconDiv.remove(); };
          iconDiv.appendChild(img);
          a.appendChild(iconDiv);
        }
        a.appendChild(el('span', { className: 'card-name', textContent: name }));
        list.appendChild(a);
      });
      frag.appendChild(g);
    });
    container.appendChild(frag);
  }

  function setTabActive(btn, on) {
    btn.classList.toggle('active', on);
    if (on) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  }

  function buildTabs() {
    topBarTabsEl.innerHTML = '';
    if (TABS.length <= 1) return;
    TABS.forEach((tab, i) => {
      const b = el('button', { className: 'tab-btn', textContent: tab.name });
      setTabActive(b, i === activeTab);
      b.onclick = () => switchTab(i);
      topBarTabsEl.appendChild(b);
    });
  }

  function switchTab(index) {
    if (index === activeTab) return;
    // Move .active class without rebuilding the tab bar
    const buttons = topBarTabsEl.querySelectorAll('.tab-btn');
    if (buttons[activeTab]) setTabActive(buttons[activeTab], false);
    if (buttons[index])     setTabActive(buttons[index], true);
    activeTab = index;
    ls.setItem('ad-tab', index);
    renderTab(index);
  }

  function renderTab(index) {
    cardGroupsEl.innerHTML = '';
    renderGroups((TABS[index] || TABS[0]).groups, cardGroupsEl);
  }

  // ── LAYOUT ──
  //
  // GAP_HMODE must match `.card-list { gap }` in horizontal mode.
  // GAP_VMODE must match `.card-groups { gap }` in vertical mode.
  // If any CSS value changes, update the corresponding JS constant.
  //
  function loadFloat(key, fallback, min, max) {
    const v = parseFloat(ls.getItem(key));
    return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : fallback;
  }
  function loadInt(key, fallback, min, max) {
    const v = parseInt(ls.getItem(key), 10);
    return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : fallback;
  }

  let CARD_W      = loadFloat('ad-card-w', 10, 5, 20);
  let CARD_H      = loadFloat('ad-card-h', 3, 1.5, 5);
  let colTarget   = loadInt('ad-columns', 10, 1, 20);
  const GAP_HMODE = 0.375;
  const GAP_VMODE = 1.5;
  const fmt       = v => parseFloat(v).toFixed(1);

  // Column caps are taken across all tabs, not just the active one, so the
  // content width (and the tab bar inside it) doesn't jump when switching tabs.
  // Horizontal: most cards in any group. Vertical: most groups between dividers.
  const CAP_H = Math.max(0, ...TABS.flatMap(t => t.groups.map(g => g.divider ? 0 : g.cards.length))) || Infinity;
  const CAP_V = Math.max(0, ...TABS.map(t => {
    let max = 0, run = 0;
    for (const g of t.groups) {
      if (g.divider) { max = Math.max(max, run); run = 0; }
      else run++;
    }
    return Math.max(max, run);
  })) || Infinity;

  function applyCardWidth(w) {
    CARD_W = w;
    ROOT.style.setProperty('--card-w', w + 'rem');
    ls.setItem('ad-card-w', w);
  }

  function applyCardHeight(h) {
    CARD_H = h;
    ROOT.style.setProperty('--card-h', h + 'rem');
    ls.setItem('ad-card-h', h);
  }

  function applyLayout() {
    const rootFont  = parseFloat(getComputedStyle(document.documentElement).fontSize); // read fresh — respects zoom changes
    const isH       = ROOT.getAttribute('data-layout') === 'horizontal';
    const gap       = isH ? GAP_HMODE : GAP_VMODE;
    const availRem  = document.documentElement.clientWidth / rootFont - 3; // subtract 3rem: .wrapper left+right padding (1.5rem × 2)
    const fits      = Math.max(1, Math.floor((availRem + gap) / (CARD_W + gap)));
    const cols      = Math.min(colTarget, fits, isH ? CAP_H : CAP_V);
    contentEl.style.width = Math.round((cols * CARD_W + (cols - 1) * gap) * rootFont) + 'px';
  }

  let resizePending = false;
  window.addEventListener('resize', () => {
    if (!resizePending) {
      resizePending = true;
      requestAnimationFrame(() => { applyLayout(); resizePending = false; });
    }
  });

  // ── OPTIONS PANEL ──
  // Built once; clicks update the active state in place so the panel stays open
  // and keyboard focus stays on the clicked control.
  function setPressed(btn, on) {
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on);
  }

  // Replaced by buildOptions() with a function that syncs the theme controls.
  let refreshThemeUI = () => {};

  function applyTheme() {
    ROOT.setAttribute('data-theme', resolveTheme(themePrefs));
    refreshThemeUI();
  }

  function saveTheme() {
    ls.setItem('ad-theme-mode',  themePrefs.mode);
    ls.setItem('ad-theme-dark',  themePrefs.dark);
    ls.setItem('ad-theme-light', themePrefs.light);
    applyTheme();
  }

  // In system mode, follow OS light/dark changes live.
  DARK_MQ.addEventListener('change', () => { if (themePrefs.mode === 'system') applyTheme(); });

  function optRow(label, values, active, attr, key, extra) {
    const row = el('div', { className: 'opt-row' });
    row.appendChild(el('span', { className: 'opt-label', textContent: label }));
    const buttons = values.map(([display, value]) => {
      const b = el('button', { className: 'pal-btn', textContent: display });
      setPressed(b, active === value);
      b.onclick = () => {
        ROOT.setAttribute(attr, value);
        ls.setItem(key, value);
        buttons.forEach(o => setPressed(o, o === b));
        if (extra) extra();
      };
      row.appendChild(b);
      return b;
    });
    return row;
  }

  function sliderRow(label, opts, onChange, fmtLabel) {
    const row    = el('div',   { className: 'opt-row' });
    const slider = el('input', { type: 'range', ...opts, className: 'opt-slider' });
    const fmtFn  = fmtLabel || fmt;
    const lbl    = el('span',  { className: 'opt-val-label', textContent: fmtFn(opts.value) });
    slider.setAttribute('aria-label', label);
    slider.oninput  = () => { lbl.textContent = fmtFn(slider.value); };
    slider.onchange = () => { lbl.textContent = fmtFn(slider.value); onChange(slider.value); };
    row.appendChild(el('span', { className: 'opt-label', textContent: label }));
    row.appendChild(slider);
    row.appendChild(lbl);
    return row;
  }

  function section(title, noBorder) {
    const s = el('div', { className: 'opt-section' + (noBorder ? ' no-border' : '') });
    s.appendChild(el('span', { className: 'opt-section-title', textContent: title }));
    return s;
  }

  function buildOptions() {
    optionsFlyEl.innerHTML = '';

    // HEADER
    const header = el('div', { className: 'flyout-header' });
    header.appendChild(el('span', { className: 'flyout-header-title', textContent: 'Aerodash ' + VERSION }));
    header.appendChild(el('a', { className: 'flyout-header-link', textContent: 'GitHub', href: 'https://github.com/Aerowinder/aerodash', target: '_blank', rel: 'noopener noreferrer' }));
    optionsFlyEl.appendChild(header);

    // THEME
    const themeSection = section('THEME', true);
    const modeRow = el('div', { className: 'opt-row' });
    modeRow.appendChild(el('span', { className: 'opt-label', textContent: 'MODE' }));
    const modeBtns = ['system', 'dark', 'light'].map(mode => {
      const b = el('button', { className: 'pal-btn', textContent: mode });
      b.onclick = () => { themePrefs.mode = mode; saveTheme(); };
      modeRow.appendChild(b);
      return [mode, b];
    });
    themeSection.appendChild(modeRow);

    const swatchRows = ['dark', 'light'].map(group => {
      const row = el('div', { className: 'opt-row' });
      row.appendChild(el('span', { className: 'opt-label', textContent: group.toUpperCase() }));
      const swatchRow = el('div', { className: 'swatch-row' });
      const swatches = THEMES[group].map(t => {
        const s = el('button', { className: 'swatch', title: t.label });
        s.setAttribute('aria-label', t.label);
        s.style.background = t.color;
        s.onclick = () => {
          themePrefs[group] = t.id;
          // Picking from the other row in a fixed mode switches to it, so the click is visible.
          if (themePrefs.mode !== 'system') themePrefs.mode = group;
          saveTheme();
        };
        swatchRow.appendChild(s);
        return [t.id, s];
      });
      row.appendChild(swatchRow);
      themeSection.appendChild(row);
      return [group, row, swatches];
    });
    optionsFlyEl.appendChild(themeSection);

    refreshThemeUI = () => {
      const current = ROOT.getAttribute('data-theme');
      modeBtns.forEach(([mode, b]) => setPressed(b, mode === themePrefs.mode));
      swatchRows.forEach(([group, row, swatches]) => {
        row.classList.toggle('dimmed', !current.startsWith(group));
        swatches.forEach(([id, s]) => setPressed(s, id === themePrefs[group]));
      });
    };
    refreshThemeUI();

    // MISC
    const misc = section('MISC');
    misc.appendChild(optRow('LINKS', [['new tab','new'],['same tab','same']], ROOT.getAttribute('data-links') || 'new', 'data-links', 'ad-links', applyLinkTargets));
    optionsFlyEl.appendChild(misc);

    // DISPLAY
    const display = section('DISPLAY');
    display.appendChild(optRow('ANIMATION', [['off','off'],['on','on']],                   ROOT.getAttribute('data-anim')    || 'on',  'data-anim',    'ad-animation'));
    display.appendChild(optRow('GLOW',      [['off','off'],['low','low'],['med','med'],['high','high']], ROOT.getAttribute('data-glow')    || 'off', 'data-glow',    'ad-glow'));
    display.appendChild(optRow('GRID',      [['off','off'],['on','on']],                   ROOT.getAttribute('data-grid')    || 'off', 'data-grid',    'ad-grid'));
    display.appendChild(optRow('ICONS',     [['off','off'],['on','on']],                   ROOT.getAttribute('data-icons')   || 'on',  'data-icons',   'ad-icons'));
    display.appendChild(optRow('STEALTH',   [['off','off'],['on','on']],                   ROOT.getAttribute('data-stealth') || 'off', 'data-stealth', 'ad-stealth'));
    optionsFlyEl.appendChild(display);

    // CARD LAYOUT
    const layout = section('CARD LAYOUT');
    layout.appendChild(optRow('VIEW',    [['horizontal','horizontal'],['vertical','vertical']], ROOT.getAttribute('data-layout') || 'horizontal', 'data-layout', 'ad-view', applyLayout));
    layout.appendChild(sliderRow('COLUMNS', { min: 1, max: 20, value: colTarget, step: 1 }, v => { colTarget = parseInt(v, 10); ls.setItem('ad-columns', colTarget); applyLayout(); }));
    // Height slider uses integer internals (value × 2) to avoid browser float
    // snap ambiguity with fractional min/step values.
    layout.appendChild(sliderRow('HEIGHT', { min: 3, max: 10, value: Math.round(CARD_H * 2), step: 1 }, v => { applyCardHeight(parseInt(v, 10) / 2); }, v => fmt(parseInt(v, 10) / 2)));
    // Same integer trick as height.
    layout.appendChild(sliderRow('WIDTH', { min: 10, max: 40, value: Math.round(CARD_W * 2), step: 1 }, v => { applyCardWidth(parseInt(v, 10) / 2); applyLayout(); }, v => fmt(parseInt(v, 10) / 2)));
    optionsFlyEl.appendChild(layout);
  }

  // Closed flyout is inert so its hidden controls can't be reached with Tab.
  function setOptionsOpen(open) {
    optionsFlyEl.classList.toggle('open', open);
    optionsFlyEl.inert = !open;
    optionsBtnEl.setAttribute('aria-expanded', open);
  }

  optionsBtnEl.addEventListener('click', e => {
    e.stopPropagation();
    setOptionsOpen(!optionsFlyEl.classList.contains('open'));
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.options-wrap'))
      setOptionsOpen(false);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && optionsFlyEl.classList.contains('open')) {
      setOptionsOpen(false);
      optionsBtnEl.focus();
    }
  });

  // ── INIT ──
  applyCardWidth(CARD_W);
  applyCardHeight(CARD_H);
  buildTabs();
  renderTab(activeTab);
  applyLayout();
  buildOptions();

</script>
</body>
</html>
